<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Rayco Edition</title>
    <style>
        :root { 
            --linea-hex: #000000;
            --hex_wpx: 100px;
            --hex_hpx: 115px;
        }
        body { background-color: #0d0d0d; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .btn-flotante { 
            position: fixed; left: 10px; z-index: 1001; cursor: pointer; 
            background: #444; border: none; color: white; padding: 10px; 
            border-radius: 5px; width: 45px; height: 40px; display: flex; 
            align-items: center; justify-content: center; font-size: 20px;
        }
        #toggle-menu { top: 10px; width: auto; padding: 10px 15px; }
        #toggle-fs { top: 60px; }

        #menu-lateral { 
            position: fixed; left: -280px; top: 0; width: 250px; height: 100%; 
            background: rgba(25, 25, 25, 0.98); backdrop-filter: blur(10px);
            transition: 0.3s; z-index: 1000; padding: 15px; border-right: 2px solid #444;
            display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }
        #menu-lateral.abierto { left: 0; }

        .seccion { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .grid-config { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.8em; }
        .grid-config input { width: 90%; background: #111; border: 1px solid #444; color: #00ff00; padding: 3px; }

        .contenedor-tablero { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: auto; background: #0a2333; 
        }
        
        .tablero { 
            display: inline-grid; 
            /* El ancho de columna debe ser el 75% del ancho del hexágono para encajar horizontalmente */
            grid-template-columns: repeat(15, calc(var(--hex_wpx) * 0.75)); 
            padding: 50px;
        }

        .hex {
            width: var(--hex_wpx); 
            height: var(--hex_hpx); 
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
            margin-left: calc(var(--hex_wpx) * -0.25);
            position: relative;
            background-size: cover;
        }

        /* Ajuste de filas impares para el zigzag */
        .hex:nth-child(even) {
            margin-top: calc(var(--hex_hpx) * 0.5);
        }

        /* Imágenes de recursos */
        .agua       { background-image: url('images/agua.png'       ); background-color: #2980b9;} /* Color de respaldo */
        .bosque     { background-image: url('images/bosque.png'     ); background-color: #27ae60;}
        .trigo      { background-image: url('images/trigo.png'      ); background-color: #f1c40f;}
        .oveja      { background-image: url('images/oveja.png'      ); background-color: #a2d149;}
        .piedra     { background-image: url('images/piedra.png'     ); background-color: #7f8c8d;}
        .arcilla    { background-image: url('images/arcilla.png'    ); background-color: #e67e22;}
        .desierto   { background-image: url('images/desierto.png'   ); background-color: #d35400;}
        .aleatorio  { background-image: none                         ; background-color: #ecf0f1; color: black; font-weight: bold;}


        .numero { background: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; border: 1px solid black; }
        .rojo { color: red; }
        .btn { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; color: white; }
        .btn-blue { background: #2980b9; }
        .btn-green { background: #27ae60; }
    </style>
</head>
<body>

<button id="toggle-menu" class="btn-flotante" onclick="toggleMenu()">☰ Menú</button>
<button id="toggle-fs" class="btn-flotante" onclick="toggleFullScreen()">📺</button>

<div id="menu-lateral">
    <div class="seccion">
        <h3>⚙️ Configuración TV</h3>
        <div class="grid-config">
            <span>Ancho (cm)</span> <input type="number" id="tv-w-cm" value="121.2" step="0.1" oninput="aplicarDimensiones()">
            <span>Alto (cm)</span> <input type="number" id="tv-h-cm" value="68.0" step="0.1">
            <span>PX Ancho</span> <input type="number" id="tv-w-px" value="1920" oninput="aplicarDimensiones()">
            <span>PX Alto</span> <input type="number" id="tv-h-px" value="1080">
        </div>
        <button class="btn btn-blue" onclick="guardarConfig()">Guardar Config</button>
    </div>
    </div>

<div class="contenedor-tablero">
    <div id="tablero" class="tablero"></div>
</div>

<script>
    const HEX_PIEZA_CM = 7.7;
    let tipoSeleccionado = 'agua';

    function aplicarDimensiones() {
        const wCm = parseFloat(document.getElementById('tv-w-cm').value);
        const wPx = parseFloat(document.getElementById('tv-w-px').value);
        
        if (wCm > 0 && wPx > 0) {
            // Calculamos píxeles por cm
            const ppcm = wPx / wCm;
            const hexW = HEX_PIEZA_CM * ppcm;
            // El alto de un hexágono regular es W * cos(30) o W * 0.866 si es punta arriba
            // Pero como Catan usa punta a los lados:
            const hexH = hexW * 0.866; 

            document.documentElement.style.setProperty('--hex_wpx', hexW + 'px');
            document.documentElement.style.setProperty('--hex_hpx', hexH + 'px');
        }
    }

    // Mantén tus funciones de crearCeldas, guardarConfig, etc. igual que las tenías
    function crearCeldasVacias() {
        const tablero = document.getElementById('tablero');
        tablero.innerHTML = '';
        for (let i = 0; i < 150; i++) {
            const hex = document.createElement('div');
            hex.className = 'hex agua';
            hex.onclick = () => hex.className = 'hex ' + tipoSeleccionado;
            tablero.appendChild(hex);
        }
    }

    window.onload = () => {
        aplicarDimensiones();
        crearCeldasVacias();
    };

    function toggleMenu() { document.getElementById('menu-lateral').classList.toggle('abierto'); }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
</script>
</body>
</html>
