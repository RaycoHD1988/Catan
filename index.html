<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Rayco Edition</title>
    <style>
        :root { 
            --linea-hex: #000000;
            --zoom-manual: 1;
            --hex_cm: 7.7;
            --wcm:121.2;
            --hcm:68;
            --wpx:1920px;
            --hpx:1080px;
        }
        body { background-color: #0d0d0d; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Botones Flotantes */
        .btn-flotante { 
            position: fixed; left: 10px; z-index: 1001; cursor: pointer; 
            background: #444; border: none; color: white; padding: 10px; 
            border-radius: 5px; width: 45px; height: 40px; display: flex; 
            align-items: center; justify-content: center; font-size: 20px;
            transition: background 0.2s;
        }
        .btn-flotante:hover { background: #666; }
        #toggle-menu { top: 10px; width: auto; padding: 10px 15px; } /* El de menú es más ancho */
        #toggle-fs { top: 60px; } /* Debajo del de menú */

        /* Menú Lateral */
        #menu-lateral { 
            position: fixed; left: -280px; top: 0; width: 250px; height: 100%; 
            background: rgba(25, 25, 25, 0.98); backdrop-filter: blur(10px);
            transition: 0.3s; z-index: 1000; padding: 15px; border-right: 2px solid #444;
            display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }
        #menu-lateral.abierto { left: 0; }

        h3 { border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 5px; color: #ffeb3b; font-size: 1.1em; }
        .seccion { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .grid-config { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.8em; }
        .grid-config input { width: 90%; background: #111; border: 1px solid #444; color: #00ff00; padding: 3px; }

        .selector-recurso { 
            display: flex; align-items: center; gap: 10px; padding: 8px; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; font-size: 0.9em;
        }
        .selector-recurso.activo { border-color: #ffeb3b; background: #444; }
        .mini { width: 25px; height: 25px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background-size: cover; }

        .contenedor-tablero { display: flex; justify-content: center; align-items: center; height: 100vh; overflow: auto; background: #0a2333; }
        
        .tablero { 
            display: inline-grid; 
            grid-template-columns: repeat(15, calc(var(--hpx)/var(--hcm)* var(--hex_cm)));
            line-height: 0; padding: 120px; transform: scale(var(--zoom-manual)); 
        }

        .hex {
            width:  calc(var(--wpx)/var(--wcm)* var(--hex_cm)); 
            height: calc(var(--hpx)/var(--hcm)* var(--hex_cm)); 
            background-size: cover; background-position: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; 
            margin-bottom: calc(var(--hex_cm) * -0.25);
            margin-right:  calc(var(--hex_cm) * -0.125);
            filter: drop-shadow(0 0 1px var(--linea-hex)); position: relative;
        }
        
        .hex::after { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border: 1px solid var(--linea-hex); pointer-events: none; }

        .hex:nth-child(30n+16), .hex:nth-child(30n+17), .hex:nth-child(30n+18), .hex:nth-child(30n+19), .hex:nth-child(30n+20),
        .hex:nth-child(30n+21), .hex:nth-child(30n+22), .hex:nth-child(30n+23), .hex:nth-child(30n+24), .hex:nth-child(30n+25),
        .hex:nth-child(30n+26), .hex:nth-child(30n+27), .hex:nth-child(30n+28), .hex:nth-child(30n+29), .hex:nth-child(30n+30) { 
            transform: translateX(calc(var(--hex_cm) * 0.375));
        }

        .agua       { background-image: url('images/agua.png'); background-color: #2980b9; }
        .bosque     { background-image: url('images/bosque.png'); background-color: #27ae60; }
        .trigo      { background-image: url('images/trigo.png'); background-color: #f1c40f;}
        .oveja      { background-image: url('images/oveja.png'); background-color: #a2d149;}
        .piedra     { background-image: url('images/piedra.png'); background-color: #7f8c8d;}
        .arcilla    { background-image: url('images/arcilla.png'); background-color: #e67e22;}
        .desierto   { background-image: url('images/desierto.png'); background-color: #d35400;}
        .aleatorio  { background-image: none; background-color: #ecf0f1; color: black; font-weight: bold; }

        .btn { width: 100%; padding: 8px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; margin-top: 5px; }
        .btn-green { background: #27ae60; }
        .btn-blue { background: #2980b9; }

        .numero { background: rgba(255, 255, 255, 0.9); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .rojo { color: red; }
    </style>
</head>
<body>

<button id="toggle-menu" class="btn-flotante" onclick="toggleMenu()">☰ Menú</button>
<button id="toggle-fs" class="btn-flotante" onclick="toggleFullScreen()" title="Pantalla Completa">📺</button>

<div id="menu-lateral">
    <div class="seccion">
        <h3>⚙️ Configuración</h3>
        <div class="grid-config">
            <span>Ancho (cm)</span> <span>Alto (cm)</span>
            <input type="number" id="tv-w-cm" value=var(--wcm) oninput="aplicarDimensiones()">
            <input type="number" id="tv-h-cm" value=var(--hcm)>
            <span>PX Ancho</span> <span>PX Alto</span>
            <input type="number" id="tv-w-px" value=var(--wpx) oninput="aplicarDimensiones()">
            <input type="number" id="tv-h-px" value=var(--hpx)>
        </div>
        <div style="font-size: 0.7em; margin-top: 5px; color: #aaa;">Detección: <span id="real-res"></span></div>
        <button class="btn btn-blue" onclick="guardarConfig()">Guardar Config</button>
    </div>

    <div class="seccion">
        <h3>🗺️ Tablero</h3>
        <button class="btn btn-green" onclick="nuevoMapa()">+ Crear Nuevo Mapa</button>
        <div id="lista-mapas" style="margin-top: 10px; font-size: 0.8em;"></div>
        <button class="btn btn-blue" onclick="guardarMapaActual()">💾 Guardar Mapa Actual</button>
    </div>

    <div class="seccion" id="editor-recursos">
        <h3>🎨 Crear nuevo</h3>
        <div class="selector-recurso activo" onclick="seleccionarTipo('agua', this)"><div class="mini agua"></div> Agua</div>
        <div class="selector-recurso" onclick="seleccionarTipo('bosque', this)"><div class="mini bosque"></div> Bosque</div>
        <div class="selector-recurso" onclick="seleccionarTipo('trigo', this)"><div class="mini trigo"></div> Trigo</div>
        <div class="selector-recurso" onclick="seleccionarTipo('oveja', this)"><div class="mini oveja"></div> Oveja</div>
        <div class="selector-recurso" onclick="seleccionarTipo('piedra', this)"><div class="mini piedra"></div> Piedra</div>
        <div class="selector-recurso" onclick="seleccionarTipo('arcilla', this)"><div class="mini arcilla"></div> Arcilla</div>
        <div class="selector-recurso" onclick="seleccionarTipo('desierto', this)"><div class="mini desierto"></div> Desierto</div>
        <div class="selector-recurso" onclick="seleccionarTipo('aleatorio', this)"><div class="mini aleatorio"></div> 🎲 Aleatorio</div>
        <button class="btn btn-green" onclick="generarAleatorios()">✨ Generar Mapa</button>
    </div>
</div>

<div class="contenedor-tablero">
    <div class="tablero" id="tablero"></div>
</div>

<script>
    // Esta es la única constante que no cambia
    const HEX_PIEZA_FISICA_CM = 7.7; 

    function aplicarDimensiones() {
        // Leemos los valores directamente de los inputs cada vez que se aplica
        const wCm = parseFloat(document.getElementById('tv-w-cm').value);
        const hCm = parseFloat(document.getElementById('tv-h-cm').value);
        const wPx = parseFloat(document.getElementById('tv-w-px').value);
        const hPx = parseFloat(document.getElementById('tv-h-px').value);

        if (wCm > 0 && wPx > 0 && hCm > 0 && hPx > 0) {
            // Calculamos la proporción
            const anchoHexPx = (wPx / wCm) * HEX_PIEZA_FISICA_CM;
            const altoHexPx = (hPx / hCm) * HEX_PIEZA_FISICA_CM; 

            // Actualizamos el CSS dinámicamente
            document.documentElement.style.setProperty('--hex_wpx', anchoHexPx + 'px');
            document.documentElement.style.setProperty('--hex_hpx', altoHexPx + 'px');
            
            console.log("Dimensiones aplicadas: " + anchoHexPx + "px de ancho por hexágono.");
        }
    }

    // Modifica tu función window.onload para asegurar el orden correcto:
    window.onload = () => {
        document.getElementById('real-res').innerText = window.screen.width + "x" + window.screen.height;
        
        const savedConfig = JSON.parse(localStorage.getItem('catan_config'));
        if(savedConfig) {
            document.getElementById('tv-w-cm').value = savedConfig.wcm;
            document.getElementById('tv-h-cm').value = savedConfig.hcm;
            document.getElementById('tv-w-px').value = savedConfig.wpx;
            document.getElementById('tv-h-px').value = savedConfig.hpx;
        }

        // IMPORTANTE: Primero cargamos los valores en los inputs, LUEGO aplicamos
        aplicarDimensiones();
        crearCeldasVacias();
        actualizarListaMapas();
    };

    // Asegúrate de que los inputs en el HTML tengan valores numéricos puros:
    // <input type="number" id="tv-w-cm" value="121.2" ...>
</script>
</body>
</html>
