<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan TV Pro - Rayco</title>
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; font-family: sans-serif; overflow: hidden; }
        #controles { background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #444; }
        
        /* Contenedor del tablero */
        .contenedor-tablero { 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 90vh;
            overflow: auto;
        }

        .tablero { 
            display: inline-grid;
            /* Ajustamos el espaciado para que encajen */
            grid-template-columns: repeat(15, 85px); 
            line-height: 0;
        }

        .hex {
            width: 100px; 
            height: 115px;
            background-color: #2c3e50;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            /* Este margen negativo hace que encajen como piezas de puzzle */
            margin-bottom: -28px; 
            margin-right: -15px;
        }

        /* Desplazamiento de filas pares para efecto panal */
        .hex:nth-child(30n+16), .hex:nth-child(30n+17), .hex:nth-child(30n+18), .hex:nth-child(30n+19), .hex:nth-child(30n+20),
        .hex:nth-child(30n+21), .hex:nth-child(30n+22), .hex:nth-child(30n+23), .hex:nth-child(30n+24), .hex:nth-child(30n+25),
        .hex:nth-child(30n+26), .hex:nth-child(30n+27), .hex:nth-child(30n+28), .hex:nth-child(30n+29), .hex:nth-child(30n+30) {
            transform: translateX(42px);
        }

        .hex:hover { transform: scale(1.05) z-index: 10; }
        
        /* Colores */
        .agua { background-color: #2980b9; }
        .bosque { background-color: #27ae60; }
        .trigo { background-color: #f1c40f; }
        .oveja { background-color: #a2d149; }
        .piedra { background-color: #7f8c8d; }
        .arcilla { background-color: #e67e22; }
        .aleatorio { background-color: #ecf0f1; color: black; font-weight: bold; }

        button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; background: #eee; }
        button:hover { background: #fff; }
        .btn-pantalla { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div id="controles">
    <button onclick="cambiarModo('fijo')">🛠️ Tierra Fija</button>
    <button onclick="cambiarModo('aleatorio')">🎲 Marcar Aleatorio</button>
    <button onclick="generarAleatorios()" style="background: #27ae60; color: white;">✨ Generar Recursos</button>
    <button class="btn-pantalla" onclick="toggleFullScreen()">📺 Pantalla Completa</button>
</div>

<div class="contenedor-tablero">
    <div class="tablero" id="tablero"></div>
</div>

<script>
    let modoActual = 'fijo';
    const tipos = ['bosque', 'trigo', 'oveja', 'piedra', 'arcilla'];
    const tablero = document.getElementById('tablero');

    // Generamos 150 hexágonos para cubrir la TV de 55"
    for (let i = 0; i < 150; i++) {
        const hex = document.createElement('div');
        hex.className = 'hex agua';
        hex.onclick = () => manejarClick(hex);
        tablero.appendChild(hex);
    }

    function cambiarModo(modo) {
        modoActual = modo;
    }

    function manejarClick(el) {
        if (modoActual === 'fijo') {
            if (el.classList.contains('agua')) el.className = 'hex bosque';
            else if (el.classList.contains('bosque')) el.className = 'hex trigo';
            else if (el.classList.contains('trigo')) el.className = 'hex oveja';
            else if (el.classList.contains('oveja')) el.className = 'hex piedra';
            else if (el.classList.contains('piedra')) el.className = 'hex arcilla';
            else el.className = 'hex agua';
        } else {
            el.className = 'hex aleatorio';
            el.innerText = '?';
        }
    }

    function generarAleatorios() {
        document.querySelectorAll('.aleatorio').forEach(hex => {
            const azar = tipos[Math.floor(Math.random() * tipos.length)];
            hex.className = 'hex ' + azar;
            hex.innerText = '';
        });
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>

</body>
</html>
