<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Rayco Edition</title>
    <style>
        :root { 
            --linea-hex: #000000;
            --hex_wpx: 100px;
        }
        body { background-color: #0d0d0d; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* BOTONES FLOTANTES AGRUPADOS A LA DERECHA */
        .controles-superiores {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .btn-flotante { 
            cursor: pointer; 
            background: #444; 
            border: none; 
            color: white; 
            padding: 10px; 
            border-radius: 5px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px;
            transition: background 0.2s;
        }
        .btn-flotante:hover { background: #666; }
        
        #toggle-menu { width: auto; padding: 10px 15px; font-size: 16px; font-weight: bold; }

        /* MENU LATERAL DERECHO */
        #menu-lateral { 
            position: fixed; 
            right: -280px; 
            top: 0; 
            width: 250px; 
            height: 100vh; 
            background: rgba(25, 25, 25, 0.98); 
            backdrop-filter: blur(10px);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; 
            padding: 20px; 
            border-left: 2px solid #444;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto; 
            box-sizing: border-box; 
        }
        #menu-lateral.abierto { right: 0; }

        /* SECCIONES COLAPSABLES */
        .seccion-colapsable { border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .cabecera-seccion { padding: 12px; background: rgba(255,255,255,0.07); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .cabecera-seccion::after { content: '▼'; font-size: 0.7em; transition: transform 0.3s; }
        .seccion-colapsable.activa .cabecera-seccion::after { transform: rotate(180deg); }
        .contenido-seccion { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 10px; opacity: 0; }
        .seccion-colapsable.activa .contenido-seccion { max-height: 500px; padding: 15px 10px; opacity: 1; }

        /* TABLERO Y MENSAJE INICIAL */
        .contenedor-tablero { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; background: #0a2333; 
            text-align: center;
        }
        #tablero {position: relative; transition: width 0.3s, height 0.3s;}
        
        .mensaje-bienvenida {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            line-height: 1.5;
        }

        .hex {
            position: absolute;
            width: var(--hex_wpx); 
            height: calc(var(--hex_wpx) * 1.1547); 
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center; 
            justify-content: center;
            background-size: cover; 
            background-position: center;
            transition: transform 0.2s;
        }
        .hex:hover { transform: scale(1.05); z-index: 10; }

        .numero-ficha {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
        }
        .rojo { color: red; font-size: 18px; }

        .btn { width: 100%; padding: 10px; border-radius: 5px; border: none; cursor: pointer; background: #2980b9; color: white; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>

 <!-- ----------------------------------------------------------------------------------------------------- -->

<body>

<div class="controles-superiores">
    <button id="toggle-fs"   class="btn-flotante" onclick="toggleFullScreen()" title="Pantalla Completa">⛶</button>
    <button id="toggle-menu" class="btn-flotante" onclick="toggleMenu()">☰ Menú</button>
</div>

<div id="menu-lateral">
    <h2 style="margin-top: 40px; border-bottom: 1px solid #444;">Catan TV</h2>
    
    <div class="seccion-colapsable activa">
        <div class="cabecera-seccion" onclick="toggleSeccion(this)">🗺️ Seleccionar Mapa</div>
        <div class="contenido-seccion">
            <button class="btn" onclick="cargarMapa('Catan básico (3-4).json')">Catan básico (3-4)</button>
        </div>
    </div>

<div class="seccion-colapsable">
    <div class="cabecera-seccion" onclick="toggleSeccion(this)">⚙️ Configuración</div>
    <div class="contenido-seccion">
        <small style="color: #888;">Elegir Pantalla Preseteada:</small>
        <select id="selector-pantalla" class="btn" style="background: #333; margin-bottom: 10px;" onchange="ajustarTamano()">
            <!-- Opciones generadas dinámicamente -->
        </select>

        <div id="ajustes-manuales" style="display: none; border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
            <div class="grid-config">
                <span>Ancho (cm)</span><span>Alto (cm)</span> 
                <input type="number" id="tv-w-cm" value="121.2" oninput="ajustarTamano()">
                <input type="number" id="tv-h-cm" value="68"    oninput="ajustarTamano()">
                
                <span>Ancho (PX)</span><span>Alto (PX)</span> 
                <input type="number" id="tv-w-px" value="1920" oninput="ajustarTamano()">
                <input type="number" id="tv-h-px" value="1080" oninput="ajustarTamano()">
            </div>
            <p style="font-size: 0.8em; color: #888; margin-top: 5px;">* Los cambios se aplican al escribir.</p>
        </div>
    </div>
</div>
</div>

<div class="contenedor-tablero">
    <div id="tablero"></div>
</div>

 <!-- ----------------------------------------------------------------------------------------------------- -->

<script>
    const HEXAGONO = {ancho_cm: 7.86, alto_cm: 9.076};
    const PANTALLAS = {
        portatil_Rayco: {ancho_cm: 346.0, alto_cm: 199.0, ancho_px: 1920, alto_px: 1080, nombre:"💻 Portátil Rayco (15\")"},
        TV_Habitacion:  {ancho_cm: 121.2, alto_cm:  68.0, ancho_px: 1920, alto_px: 1080, nombre:"📺 TV Habitación (55\")"},
        personalizado:  {ancho_cm: 121.2, alto_cm:  68.0, ancho_px: 1920, alto_px: 1080, nombre:"🛠️ Ajuste Personalizado"}
    }
    const terrenosSinNumero = ['vacio', 'agua', 'desierto', 'puerto_comercial', 'oasis'];
    const tablero = document.getElementById('tablero');
    const menu    = document.getElementById('menu-lateral');
    let mapaActualData = null;


    function iniciarTodo() {
        // 1. Ponemos la pantalla completa
        toggleFullScreen();
        // 2. Cargamos el mapa del catan más básico.
        cargarMapa('Catan básico (3-4).json');
    }
    function actualizarSelectorPantallas() {
        const selector = document.getElementById('selector-pantalla');
        selector.innerHTML = ''; // Limpiamos

        // Recorremos el objeto PANTALLAS
        for (const key in PANTALLAS) {
            const opcion = document.createElement('option');
            opcion.value = key;
            opcion.innerText = PANTALLAS[key].nombre;
            selector.appendChild(opcion);
        }
    }

    function ajustarTamano() {
        const pantalla_seleccionada = document.getElementById('selector-pantalla').value;
        const bloqueManual = document.getElementById('ajustes-manuales');
        if (pantalla_seleccionada === 'personalizado') {
            bloqueManual.style.display = 'block';
            PANTALLAS.personalizado = {
                ancho_cm: parseFloat(document.getElementById('tv-w-cm').value),
                alto_cm:  parseFloat(document.getElementById('tv-h-cm').value),
                ancho_px: parseInt(document.getElementById('tv-w-px').value),
                alto_px:  parseInt(document.getElementById('tv-h-px').value)
            }
        }else {
            bloqueManual.style.display = 'none';
        }
        document.getElementById('tv-w-cm').value = PANTALLAS[pantalla_seleccionada].ancho_cm;
        document.getElementById('tv-h-cm').value = PANTALLAS[pantalla_seleccionada].alto_cm;
        document.getElementById('tv-w-px').value = PANTALLAS[pantalla_seleccionada].ancho_px;
        document.getElementById('tv-h-px').value = PANTALLAS[pantalla_seleccionada].alto_px;
        document.documentElement.style.setProperty('--hex_wpx', PANTALLAS[pantalla_seleccionada].ancho_px * HEXAGONO.ancho_cm / PANTALLAS[pantalla_seleccionada].ancho_cm + 'px');
        if (mapaActualData) renderizarMapa(mapaActualData);
    }
    function toggleMenu() {menu.classList.toggle('abierto');}
    function toggleSeccion(el) {el.parentElement.classList.toggle('activa');}
    function mostrarPantallaInicio() {
        tablero.innerHTML = `
            <div class="mensaje-bienvenida">
                <h1 style="color: #f1c40f;">Catan Pro TV</h1>
                <button class="btn" style="padding: 20px; font-size: 1.2em; background: #27ae60;" 
                    onclick="iniciarTodo()">
                    🚀 EMPEZAR PARTIDA
                </button>
                <p style="font-size: 0.5em; opacity: 0.6; margin-top: 15px;">
                    (Se activará la pantalla completa automáticamente)
                </p>
            </div>`;
    }

    async function cargarMapa(nombreMapa) {
        try {
            const respuesta = await fetch(`maps/${nombreMapa}`);
            if (!respuesta.ok) {
                throw new Error(`No se pudo encontrar el archivo: maps/${nombreMapa}`);
            }

            let maps = await respuesta.json();
            mapaActualData = maps
            maps = procesarConfiguracion(maps);
            renderizarMapa(maps);
            toggleMenu(); // Cerramos el menú al cargar con éxito
            
        }catch (e) {
            console.error("Error cargando el JSON:", e);
            alert(`Error: Asegúrate de que el archivo JSON existe en la carpeta maps/${nombreMapa}`);
        }
    }

    function procesarConfiguracion(maps) {
        // --- 1. PREPARAR BOLSAS DE RECURSOS Y LAS ASIGNAMOS---
        for (const key in maps.recursos) {
            let bolsa = [];
            const r = maps.recursos[key];
            r.tipos.forEach((tipo, i) => {
                for (let c = 0; c < r.cantidades[i]; c++) bolsa.push(tipo);
            });

            // Mezclamos la bolsa
            bolsa= bolsa.sort(() => Math.random() - 0.5);

            // Asignamos tipos a hexágonos que usan esta bolsa
            maps.hexagono.filter(h => h.tipo === key).forEach((h, index) => {
                h.tipo = bolsa[index] || null;
            });
        }

        // --- 2. ASIGNAR NÚMEROS POR ÓRDENES ---
        // Procesamos cada grupo de orden (orden_1, orden_2...)
        for (const ordenKey in maps.numeros) {
            const infoOrden = maps.numeros[ordenKey];
            let listaNumeros = [...infoOrden.valores];
            
            if (infoOrden.tipo === "aleatorio") {
                listaNumeros = listaNumeros.sort(() => Math.random() - 0.5);
            }

            // Filtramos hexágonos que pertenecen a este orden y NO son desierto/agua
            const hexsValidos = maps.hexagono
                .filter(h => h[ordenKey] > 0 && !terrenosSinNumero.includes(h.tipo))
                .sort((a, b) => a[ordenKey] - b[ordenKey]);

            // Asignamos el número de la lista según la posición
            hexsValidos.forEach((h, index) => {
                h.numeroFinal = listaNumeros[index] || null;
            });
        }

        return maps;
    }

    function renderizarMapa(maps) {
        tablero.innerHTML = '';
        
        // 1. Obtener medidas actuales
        const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hex_wpx'));
        const f_spacing = w * 1.1547 * 0.75; 
        const c_spacing = w;

        // 2. Calcular límites para centrado automático
        let minF = Infinity, maxF = -Infinity;
        let minC = Infinity, maxC = -Infinity;

        maps.hexagono.forEach(h => {
            if (h.f < minF) minF = h.f;
            if (h.f > maxF) maxF = h.f;
            if (h.c < minC) minC = h.c;
            if (h.c > maxC) maxC = h.c;
        });

        // 3. Ajustar el tamaño del contenedor #tablero
        const filas = (maxF - minF);
        const columnas = (maxC - minC);
        
        // Calculamos ancho y alto total (+1 para el último hexágono)
        const totalW = (columnas * c_spacing) + w;
        const totalH = (filas * f_spacing) + (w * 1.15);

        tablero.style.width = totalW + 'px';
        tablero.style.height = totalH + 'px';
        
        // Centrado: desplazamos el tablero para que la coordenada mínima sea el 0,0
        const offsetTop = minF * f_spacing;
        const offsetLeft = minC * c_spacing;

        // 4. Dibujar hexágonos
        maps.hexagono.forEach(h => {
            const div = document.createElement('div');
            div.className = `hex ${h.tipo}`;
            div.style.backgroundImage = `url('images/${h.tipo}.png')`;
            
            // Posicionamos restando el offset para que el mapa empiece en el borde del contenedor
            div.style.top = ((h.f * f_spacing) - offsetTop) + 'px';
            div.style.left = ((h.c * c_spacing) - offsetLeft) + 'px';

            if (h.numeroFinal) {
                const ficha = document.createElement('div');
                ficha.className = 'numero-ficha' + (h.numeroFinal === 6 || h.numeroFinal === 8 ? ' rojo' : '');
                ficha.innerText = h.numeroFinal;
                div.appendChild(ficha);
            }

            tablero.appendChild(div);
        });
    }

    function toggleFullScreen() {
        const btn = document.getElementById('toggle-fs');
        if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerText = "❐"; // Icono de "ventanas superpuestas" al entrar
                }).catch(err => {
                    console.error(`Error al intentar entrar en pantalla completa: ${err.message}`);
                });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                btn.innerText = "⛶"; // Icono de "expandir"
            }
        }
    }

    window.onload = () => {
        actualizarSelectorPantallas(); // Genera el menú dinámicamente
        mostrarPantallaInicio();       // Muestra el mensaje de bienvenida

        // Define la pantalla personalizada por defecto.
        document.getElementById('selector-pantalla').value = 'personalizado';
        ajustarTamano(); 
        
    };
</script>

</body>
</html>
