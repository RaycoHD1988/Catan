<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan TV Pro - Rayco</title>
    <style>
        body { background-color: #1a1a1a; color: white; margin: 0; font-family: sans-serif; overflow: hidden; }
        #controles { background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #444; }
        
        .contenedor-tablero { 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 90vh;
            overflow: auto;
        }

        .tablero { 
            display: inline-grid;
            grid-template-columns: repeat(15, 85px); 
            line-height: 0;
        }

        .hex {
            width: 100px; 
            height: 115px;
            background-size: cover; /* Para que la imagen cubra todo el hexágono */
            background-position: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: -28px; 
            margin-right: -15px;
            border: 2px solid rgba(255, 255, 255, 0.1); /* Borde sutil */
        }

        /* Desplazamiento de filas pares para efecto panal */
        .hex:nth-child(30n+16), .hex:nth-child(30n+17), .hex:nth-child(30n+18), .hex:nth-child(30n+19), .hex:nth-child(30n+20),
        .hex:nth-child(30n+21), .hex:nth-child(30n+22), .hex:nth-child(30n+23), .hex:nth-child(30n+24), .hex:nth-child(30n+25),
        .hex:nth-child(30n+26), .hex:nth-child(30n+27), .hex:nth-child(30n+28), .hex:nth-child(30n+29), .hex:nth-child(30n+30) {
            transform: translateX(42px);
        }

        .hex:hover { transform: scale(1.05) z-index: 10; }
        
        /* Imágenes de recursos */
        .agua { background-image: url('images/agua.png'); background-color: #2980b9; } /* Color de respaldo */
        .bosque { background-image: url('images/bosque.png'); }
        .trigo { background-image: url('images/trigo.png'); }
        .oveja { background-image: url('images/oveja.png'); }
        .piedra { background-image: url('images/piedra.png'); }
        .arcilla { background-image: url('images/arcilla.png'); }
        .desierto { background-image: url('images/desierto.png'); }
        .aleatorio { background-image: none; background-color: #ecf0f1; color: black; font-weight: bold; }

        .numero { 
            background: rgba(255, 255, 255, 0.8); 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 18px; 
            color: #333;
            border: 2px solid #555;
            position: relative;
            z-index: 2; /* Para que esté por encima de la imagen */
        }
        .numero.rojo { color: #c0392b; } /* Números críticos 6 y 8 */


        button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; background: #eee; }
        button:hover { background: #fff; }
        .btn-pantalla { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div id="controles">
    <button onclick="cambiarModo('agua')">🌊 Mar</button>
    <button onclick="cambiarModo('fijo')">🛠️ Tierra Fija</button>
    <button onclick="cambiarModo('aleatorio')">🎲 Marcar Aleatorio</button>
    <button onclick="generarAleatorios()" style="background: #27ae60; color: white;">✨ Generar Recursos</button>
    <button class="btn-pantalla" onclick="toggleFullScreen()">📺 Pantalla Completa</button>
</div>

<div class="contenedor-tablero">
    <div class="tablero" id="tablero"></div>
</div>

<script>
    let modoActual = 'agua'; // Empezamos con modo agua
    const tiposRecursos = ['bosque', 'trigo', 'oveja', 'piedra', 'arcilla', 'desierto'];
    const numerosCatan = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12]; // Números estándar de Catan
    const tablero = document.getElementById('tablero');

    // Generamos 150 hexágonos para cubrir la TV de 55"
    for (let i = 0; i < 150; i++) {
        const hex = document.createElement('div');
        hex.className = 'hex agua';
        hex.onclick = () => manejarClick(hex);
        tablero.appendChild(hex);
    }

    function cambiarModo(modo) {
        modoActual = modo;
    }

    function manejarClick(el) {
        if (modoActual === 'agua') {
            el.className = 'hex agua';
            el.innerHTML = '';
        } else if (modoActual === 'fijo') {
            // Ciclo de tipos de tierra fija (incluyendo desierto)
            if (el.classList.contains('agua')) el.className = 'hex bosque';
            else if (el.classList.contains('bosque')) el.className = 'hex trigo';
            else if (el.classList.contains('trigo')) el.className = 'hex oveja';
            else if (el.classList.contains('oveja')) el.className = 'hex piedra';
            else if (el.classList.contains('piedra')) el.className = 'hex arcilla';
            else if (el.classList.contains('arcilla')) el.className = 'hex desierto';
            else el.className = 'hex agua'; // Vuelve a agua si ya era desierto
            el.innerHTML = ''; // Limpiamos el número si lo hubiera
        } else if (modoActual === 'aleatorio') {
            el.className = 'hex aleatorio';
            el.innerText = '?';
        }
    }

    function generarAleatorios() {
        const celdasAleatorias = document.querySelectorAll('.aleatorio');
        
        // Asignar recursos a las celdas marcadas como aleatorias
        let tiposTemporales = [...tiposRecursos]; // Copia para no modificar el original
        celdasAleatorias.forEach(hex => {
            if (tiposTemporales.length === 0) tiposTemporales = [...tiposRecursos]; // Reiniciar si se acaban los tipos
            const tipoAleatorio = tiposTemporales.splice(Math.floor(Math.random() * tiposTemporales.length), 1)[0];
            hex.className = 'hex ' + tipoAleatorio;
            hex.innerText = ''; // Limpiamos el '?'
        });

        // Asignar números (solo a los hexágonos que no sean desierto ni agua)
        let numerosTemporales = [...numerosCatan]; // Copia de los números
        document.querySelectorAll('.hex:not(.agua):not(.desierto)').forEach(hex => {
            if (numerosTemporales.length === 0) { // Si se acaban los números, reiniciamos o manejamos el error
                numerosTemporales = [...numerosCatan]; 
            }
            const numeroIndex = Math.floor(Math.random() * numerosTemporales.length);
            const numero = numerosTemporales.splice(numeroIndex, 1)[0];
            
            const numeroDiv = document.createElement('div');
            numeroDiv.className = 'numero';
            if (numero === 6 || numero === 8) {
                numeroDiv.classList.add('rojo');
            }
            numeroDiv.innerText = numero;
            hex.innerHTML = ''; // Limpiamos cualquier contenido previo
            hex.appendChild(numeroDiv);
        });
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>

</body>
</html>
