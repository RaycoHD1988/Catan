<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Escala Real Rayco</title>
    <style>
        :root { 
            /* CONSTANTES FÍSICAS DE TU TV */
            --tv-ancho-cm: 121.2;
            --tv-alto-cm: 68;
            --pieza-catan-cm: 8; /* Ancho de punta a punta del hexágono real */
            
            /* CÁLCULO DE PÍXELES (se actualiza por JS) */
            --px-por-cm: 15.8; /* Valor inicial estimado */
            
            --linea-hex: #000000;
            --ancho-hex: calc(var(--pieza-catan-cm) * var(--px-por-cm));
            --alto-hex: calc(var(--ancho-hex) * 1.1547); /* Proporción geométrica */
        }

        body { background-color: #0d0d0d; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Menú Lateral */
        #menu-lateral { 
            position: fixed; left: -250px; top: 0; width: 220px; height: 100%; 
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px);
            transition: 0.3s; z-index: 1000; padding: 20px; border-right: 2px solid #444;
            display: flex; flex-direction: column; gap: 10px;
        }
        #menu-lateral.abierto { left: 0; }
        #toggle-menu { position: fixed; left: 10px; top: 10px; z-index: 1001; cursor: pointer; background: #444; border: none; color: white; padding: 10px; border-radius: 5px; }

        .selector-recurso { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .selector-recurso.activo { border-color: #ffeb3b; background: #444; }
        .mini { width: 30px; height: 30px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background-size: cover; background-position: center; }

        /* Contenedor y Tablero */
        .contenedor-tablero { 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: auto; background: #0a2333; 
        }

        .tablero { 
            display: inline-grid; 
            /* Encaje perfecto: 75% del ancho para la siguiente columna */
            grid-template-columns: repeat(15, calc(var(--ancho-hex) * 0.76)); 
            line-height: 0; padding: 100px; 
        }

        .hex {
            width: var(--ancho-hex);
            height: var(--alto-hex);
            background-size: cover; background-position: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
            /* Margen negativo para que los picos encajen verticalmente */
            margin-bottom: calc(var(--alto-hex) * -0.26);
            margin-right: calc(var(--ancho-hex) * -0.12);
            filter: drop-shadow(0 0 1px var(--linea-hex)) drop-shadow(0 0 1px var(--linea-hex));
            position: relative;
        }

        .hex::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 2px solid var(--linea-hex); pointer-events: none;
        }

        /* Zig-zag corregido para 15 columnas */
        .hex:nth-child(30n+16), .hex:nth-child(30n+17), .hex:nth-child(30n+18), .hex:nth-child(30n+19), .hex:nth-child(30n+20),
        .hex:nth-child(30n+21), .hex:nth-child(30n+22), .hex:nth-child(30n+23), .hex:nth-child(30n+24), .hex:nth-child(30n+25),
        .hex:nth-child(30n+26), .hex:nth-child(30n+27), .hex:nth-child(30n+28), .hex:nth-child(30n+29), .hex:nth-child(30n+30) {
            transform: translateX(calc(var(--ancho-hex) * 0.38));
        }

        /* Recursos e Imágenes */
        .agua { background-image: url('images/agua.png'); background-color: #2980b9; }
        .bosque { background-image: url('images/bosque.png'); background-color: #27ae60; }
        .trigo { background-image: url('images/trigo.png'); background-color: #f1c40f; }
        .oveja { background-image: url('images/oveja.png'); background-color: #a2d149; }
        .piedra { background-image: url('images/piedra.png'); background-color: #7f8c8d; }
        .arcilla { background-image: url('images/arcilla.png'); background-color: #e67e22; }
        .desierto { background-image: url('images/desierto.png'); background-color: #d35400; }
        .aleatorio { background-image: none; background-color: #ecf0f1; color: black; font-weight: bold; }

        .numero { background: rgba(255, 255, 255, 0.9); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #333; }
        .rojo { color: red; }
    </style>
</head>
<body>

<button id="toggle-menu" onclick="toggleMenu()">☰ Menú</button>

<div id="menu-lateral">
    <h3>Recursos</h3>
    <div class="selector-recurso activo" onclick="seleccionarTipo('agua', this)"><div class="mini agua"></div> Agua</div>
    <div class="selector-recurso" onclick="seleccionarTipo('bosque', this)"><div class="mini bosque"></div> Bosque</div>
    <div class="selector-recurso" onclick="seleccionarTipo('trigo', this)"><div class="mini trigo"></div> Trigo</div>
    <div class="selector-recurso" onclick="seleccionarTipo('oveja', this)"><div class="mini oveja"></div> Oveja</div>
    <div class="selector-recurso" onclick="seleccionarTipo('piedra', this)"><div class="mini piedra"></div> Piedra</div>
    <div class="selector-recurso" onclick="seleccionarTipo('arcilla', this)"><div class="mini arcilla"></div> Arcilla</div>
    <div class="selector-recurso" onclick="seleccionarTipo('desierto', this)"><div class="mini desierto"></div> Desierto</div>
    <div class="selector-recurso" onclick="seleccionarTipo('aleatorio', this)"><div class="mini aleatorio"></div> 🎲 Aleatorio (?)</div>
    <hr>
    <button onclick="generarTodo()" style="background: #27ae60; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">✨ Generar Mapa</button>
    <button onclick="toggleFullScreen()" style="background: #e74c3c; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">📺 Pantalla Completa</button>
</div>

<div class="contenedor-tablero">
    <div class="tablero" id="tablero"></div>
</div>

<script>
    let tipoSeleccionado = 'agua';
    const tiposAleatorios = ['bosque', 'trigo', 'oveja', 'piedra', 'arcilla'];

    // Función para calcular la escala real basada en tus medidas
    function calibrarPantalla() {
        const anchoPx = window.screen.width;
        const anchoCm = 121.2; // Tu constante
        const pxPorCm = anchoPx / anchoCm;
        document.documentElement.style.setProperty('--px-por-cm', pxPorCm);
    }

    window.onload = calibrarPantalla;
    window.onresize = calibrarPantalla;

    function toggleMenu() { document.getElementById('menu-lateral').classList.toggle('abierto'); }

    function seleccionarTipo(tipo, elemento) {
        tipoSeleccionado = tipo;
        document.querySelectorAll('.selector-recurso').forEach(el => el.classList.remove('activo'));
        elemento.classList.add('activo');
    }

    const tablero = document.getElementById('tablero');
    for (let i = 0; i < 150; i++) {
        const hex = document.createElement('div');
        hex.className = 'hex agua';
        hex.onclick = () => { 
            hex.className = 'hex ' + tipoSeleccionado; 
            hex.innerText = tipoSeleccionado === 'aleatorio' ? '?' : ''; 
            hex.innerHTML = '';
        };
        tablero.appendChild(hex);
    }

    function generarTodo() {
        document.querySelectorAll('.hex.aleatorio').forEach(hex => {
            const azar = tiposAleatorios[Math.floor(Math.random() * tiposAleatorios.length)];
            hex.className = 'hex ' + azar;
            hex.innerText = '';
            const num = [2,3,4,5,6,8,9,10,11,12][Math.floor(Math.random()*10)];
            hex.innerHTML = `<div class="numero ${num===6||num===8?'rojo':''}">${num}</div>`;
        });
        toggleMenu();
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }
</script>

</body>
</html>
