<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Rayco Edition</title>
    <style>
        :root {
            --linea-hex: #000000;
            --hex_wpx: 100px;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .controles-superiores {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .btn-flotante {
            cursor: pointer;
            background: #444;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
        }

        .btn-flotante:hover {
            background: #666;
        }

        #toggle-menu {
            width: auto;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
        }

        /* Dados 3D */
        #panel-dados-external {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 2000;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #resultado-suma {
            font-size: 3.5em;
            color: #f1c40f;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
            margin: 0;
            line-height: 1;
        }

        .dice-wrapper {
            display: flex;
            gap: 15px;
        }

        .scene {
            width: 50px;
            height: 50px;
            perspective: 300px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.2, 0.8, 0.3, 1);
            transform: translateZ(-25px);
        }

        .cube_face {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ffffff;
            border: 1px solid #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #111;
            border-radius: 8px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.1);
        }

        .face-1 {transform: rotateY(0deg) translateZ(25px);}
        .face-2 {transform: rotateY(180deg) translateZ(25px);}
        .face-3 {transform: rotateY(90deg) translateZ(25px);}
        .face-4 {transform: rotateY(-90deg) translateZ(25px);}
        .face-5 {transform: rotateX(90deg) translateZ(25px);}
        .face-6 {transform: rotateX(-90deg) translateZ(25px);}

        .btn-lanzar {
            width: 100%;
            padding: 12px;
            background: #d35400;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-lanzar:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .btn-lanzar:active {transform: scale(0.95);}


        /* MENU LATERAL DERECHO */
        #menu-lateral {
            position: fixed;
            right: -280px;
            top: 0;
            width: 250px;
            height: 100vh;
            background: rgba(25, 25, 25, 0.98);
            backdrop-filter: blur(10px);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding: 20px;
            border-left: 2px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #menu-lateral.abierto {
            right: 0;
        }

        .seccion-colapsable {
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .cabecera-seccion {
            padding: 12px;
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .cabecera-seccion::after {
            content: '▼';
            font-size: 0.7em;
            transition: transform 0.3s;
        }

        .seccion-colapsable.activa .cabecera-seccion::after {
            transform: rotate(180deg);
        }

        .contenido-seccion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding: 0 10px;
            opacity: 0;
        }

        .seccion-colapsable.activa .contenido-seccion {
            max-height: 1000px;
            padding: 15px 10px;
            opacity: 1;
        }

        .btn-cerrar-piezas {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 1001;
        }

        .btn-cerrar-piezas:hover {
            color: #e74c3c;
        }

        #menu-piezas-creador {
            position: fixed;
            left: 20px;
            top: 80px;
            bottom: 20px;
            width: 350px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #444;
            border-radius: 15px;
            z-index: 10000;
            display: none;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            opacity: 1;
            transform: none;
            cursor: grab;
        }

        #menu-creador {
            position: fixed;
            right: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: rgba(40, 20, 40, 0.98);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
        }

        #menu-creador.abierto {
            display: flex;
        }

        #contenedor-mapa-piezas {
            position: relative;
            width: 100%;
            min-width: 100%;
            min-height: 1000px; 
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 40px;
        }

        .paleta-editor-lateral {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            justify-items: center;
        }

        .pincel-opcion-label {
            font-size: 0.7em;
            color: #ccc;
            text-align: center;
            margin-top: 5px;
            width: 100%;
        }

        .contenedor-pincel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* TABLERO Y MENSAJE INICIAL */
        .contenedor-tablero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: #0a2333;
            text-align: center;
        }

        #tablero {
            position: relative;
            transition: width 0.3s, height 0.3s;
        }

        .mensaje-bienvenida {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            line-height: 1.5;
        }

        .hex {
            position: absolute;
            width: var(--hex_wpx);
            height: calc(var(--hex_wpx) * 1.1547);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s;
        }

        .capa-visual-fondo,
        .capa-visual-detalle,
        .capa-hex {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            pointer-events: none;
        }

        .capa-interaccion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            z-index: 100;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bruma {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }

        .capa-interaccion:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .hex:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .numero-ficha {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            z-index: 10;
            position: relative;
        }

        .hex.iluminado {
            transform: scale(1.1);
            z-index: 500;
            filter: brightness(1.1) drop-shadow(0 0 15px #f1c40f);
            transition: all 0.5s ease;
        }

        .hex.iluminado .numero-ficha {
            background: #f1c40f !important;
            border-color: white;
            box-shadow: 0 0 10px white;
            transform: scale(1.2);
        }

        #submenu-giros {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 15px;
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            z-index: 2000;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .opcion-giro {
            width: 80px;
            height: calc(80px * 1.1547);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .opcion-giro.hex {
            position: relative;
            top: 0;
            left: 0;
        }

        .opcion-giro:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .overlay-giro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 1999;
        }

        .rojo {color: red; font-size: 18px;}

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background: #2980b9;
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .modo-edicion .hex {
            width: 30px !important;
            height: calc(30px * 1.1547) !important;
            outline: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modo-edicion .ficha-orden-0 { background-color: #2980b9 !important; color: black; border-color: #000; }
        .modo-edicion .ficha-orden-1 { background-color: #f1c40f !important; color: black; border-color: #000; }
        .modo-edicion .ficha-orden-2 { background-color: #27ae60 !important; color: black; border-color: #000; }

    
        .btn-orden-selector {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .btn-orden-selector.activo {
            border: 2px solid #fff;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .paleta-editor {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .pincel-opcion {
            width: 45px;
            height: 45px;
            cursor: pointer;
            border: 2px solid transparent;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-size: cover;
        }

        .pincel-opcion.activo {
            border: 2px solid #f1c40f;
            transform: scale(1.1);
        }

        .pintando {
            cursor: crosshair !important;
        }
    </style>
</head>

<body>

    <div class="controles-superiores">
        <button id="toggle-fs" class="btn-flotante" onclick="toggleFullScreen()" title="Pantalla Completa">⛶</button>
        <button id="toggle-menu" class="btn-flotante" onclick="toggleMenu()">☰ Menú</button>
    </div>

    <div id="panel-dados-external" style="display: none;"></div>

    <!-- Menú Piezas (Ahora visual) -->
    <div id="menu-piezas-creador">
        <div
            style="position: absolute; top: 10px; left: 10px; z-index: 10; color: #f1c40f; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;">
            Paleta de Piezas
        </div>
        <div id="contenedor-mapa-piezas"></div>
        <div id="contenedor-gestor-aleatorios" style="display:none;"></div>
    </div>

    <!-- Menú Creador (Derecha) -->
    <div id="menu-creador">
        <h2 style="color: #e67e22; border-bottom: 1px solid #eba166; padding-bottom: 5px;">🛠️ Editor</h2>

        <div class="input-group" style="margin-bottom: 5px;">
            <label style="display: block; font-size: 0.8em; margin-bottom: 5px; color: #ccc;">Nombre del Mapa</label>
            <input type="text" id="input-nombre-mapa" value="Mapa Nuevo"
                style="width: 100%; padding: 10px; background: transparent; border: 1px solid #666; color: white; border-radius: 5px;">
        </div>

        <div id="selector-capas" style="margin-bottom: 20px; border-top: 1px solid #444; padding-top: 10px;">
            <label style="display: block; font-size: 0.8em; margin-bottom: 10px; color: #ccc;">Capa de Trabajo</label>
            <div style="display: flex; gap: 5px;">
                <button id="btn-capa-0" class="btn" style="background: #2980b9; flex: 1;" onclick="seleccionarCapa(0)">Capa 1</button>
                <button id="btn-capa-1" class="btn" style="background: #444; flex: 1;" onclick="seleccionarCapa(1)">Capa 2</button>
                <button id="btn-capa-2" class="btn" style="background: #444; flex: 1;" onclick="seleccionarCapa(2)">Capa 3</button>
            </div>
        </div>

        <button class="btn" style="background: #27ae60;" onclick="jugarMapaActual()">🎮 Jugar este Mapa</button>

        <div id="contenedor-gestor-ordenes" style="margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
        </div>

        <div style="margin-top: auto;">
            <hr style="border-color: #444; width: 100%;">
            <label style="display: block; font-size: 0.8em; margin-bottom: 5px; color: #ccc;">Importar /
                Exportar</label>
            <button class="btn" style="background: #34495e;" onclick="document.getElementById('file-upload').click()">📂
                Cargar JSON</button>
            <input type="file" id="file-upload" accept=".json" style="display: none;"
                onchange="cargarMapaDesdeArchivo(this)">
            <button class="btn" style="background: #2980b9;" onclick="descargarJSONCreado()">💾 Descargar JSON</button>
        </div>
    </div>

    <div id="menu-lateral">
        <h2 style="margin-top: 40px; border-bottom: 1px solid #444;">Catan TV</h2>

        <div class="seccion-colapsable activa">
            <div class="cabecera-seccion" onclick="toggleSeccion(this)">🗺️ Seleccionar Mapa</div>
            <div class="contenido-seccion">
                <button class="btn" style="background: #d35400; font-weight: bold; border-left: 5px solid #e67e22;"
                    onclick="activarModoCreador()">🎨 Modo Creador</button>
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0;"></div>
                <button class="btn" onclick="cargarMapa('Catan básico (3-4).json')">Catan básico (3-4)</button>
                <button class="btn" onclick="cargarMapa('Catan básico (5-6).json')">Catan básico (5-6)</button>
                <button class="btn" onclick="cargarMapa('Rumbo a nuevas orillas (3-4).json')">Rumbo a nuevas orillas
                    (3-4)</button>
                <button class="btn" onclick="cargarMapa('Ataque de los bárbaros (3-4).json')">Ataque de los bárbaros
                    (3-4)</button>
            </div>
        </div>

        <div class="seccion-colapsable">
            <div class="cabecera-seccion" onclick="toggleSeccion(this)">📏 Tamaño Hexagono</div>
            <div class="contenido-seccion">
                <p style="font-size: 0.8em; color: #888; margin-bottom: 10px;">
                </p>
                <div
                    style="display: flex; align-items: center; justify-content: center; gap: 5px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px;">
                    <button class="btn" style="width: 40px; margin:0; background: #e74c3c;"
                        onclick="cambiarPixeles(-1)">◀</button>
                    <input type="number" id="input-calibracion-px"
                        style="width: 70px; text-align: center; font-size: 1.1em; font-weight: bold; background: transparent; color: #f1c40f; border: 1px solid #444; padding: 5px; -moz-appearance: textfield;"
                        oninput="setPixelesDirecto(this.value)">
                    <button class="btn" style="width: 40px; margin:0; background: #27ae60;"
                        onclick="cambiarPixeles(1)">▶</button>
                </div>
                <p style="font-size: 0.7em; color: #888; margin-top: 10px; text-align: center;">
                    Unidad: Píxeles por hexágono. Aprox. 32" = 165px, 55" = 99px.
                </p>
            </div>
        </div>
    </div>

    <div class="contenedor-tablero">
        <div id="tablero"></div>
    </div>
    <div id="overlay-editor" class="overlay-giro" onclick="cerrarSubmenu()"></div>
    <div id="submenu-giros"></div>

    <!-- ----------------------------------------------------------------------------------------------------- -->

    <script>
        const terrenosSinNumero = ['vacio', 'agua', 'desierto', 'puerto_comercial', 'oasis', 'puerto_2_1_madera', 'puerto_2_1_barro', 'puerto_2_1_oveja', 'puerto_2_1_trigo', 'puerto_2_1_piedra', 'puerto_3_1', 'borde recto', 'borde esquina'];
        const tablero = document.getElementById('tablero');
        const menu = document.getElementById('menu-lateral');

        // NUEVA ESTRUCTURA DE VARIABLES
        let mapa_original = null; // El JSON crudo sin modificar
        let mapa_visual = null; // El estado actual procesado (fichas fijadas, etc)
        let configNumerosOrdenes = {}; // Almacena los arrays de números para cada orden
        let configRecursosAleatorios = {}; // Almacena qué recursos salen de cada bolsa de aleatorios

        let capaActiva = 0; // Por defecto Capa 1 (índice 0)
        let piezaSeleccionada = null;
        let giroSeleccionado = 0;

        function seleccionarCapa(n) {
            capaActiva = n;
            // Actualizar UI de botones
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`btn-capa-${i}`);
                btn.style.background = (i === n) ? '#2980b9' : '#444';
            }
            // Si estábamos en modo orden, lo desactivamos al cambiar de capa
            nivelOrdenActivo = 0;
            actualizarUIOrdenes();
        }

        async function activarModoCreador() {
            // 1. UI Updates
            document.body.classList.add('modo-edicion');
            document.getElementById('menu-lateral').classList.remove('abierto');
            document.getElementById('menu-creador').classList.add('abierto');
            document.getElementById('menu-piezas-creador').style.display = 'block';

            // 2. Init Grid 20x20 (Temporary variable, will become mapa_original)
            let nuevaRejilla = [];
            for (let f = 0; f < 20; f++) {
                for (let c = 0; c < 20; c++) {
                    const offset = (f % 2 !== 0) ? 0.5 : 0;
                    nuevaRejilla.push({ f: f, c: c + offset, tipo: 'vacio' });
                }
            }

            // 3. Load EXISTING data into grid (Center it)
            if (mapa_original && mapa_original.hexagono) {
                let minF = Math.min(...mapa_original.hexagono.map(h => h.f));
                let maxF = Math.max(...mapa_original.hexagono.map(h => h.f));
                let minC = Math.min(...mapa_original.hexagono.map(h => h.c));
                let maxC = Math.max(...mapa_original.hexagono.map(h => h.c));
                const anchoMapa = maxC - minC;
                const altoMapa = maxF - minF;
                
                const offsetF = Math.floor(10 - (altoMapa / 2)) - minF;
                const offsetC = Math.floor(10 - (anchoMapa / 2)) - minC;

                mapa_original.hexagono.forEach(h => {
                    const nuevoF = h.f + offsetF;
                    const nuevoC = h.c + offsetC;
                    
                    // Buscamos con un margen de tolerancia para decimales (0.1)
                    const target = nuevaRejilla.find(d =>  d.f === nuevoF && Math.abs(d.c - nuevoC) < 0.1);
                    
                    if (target) {
                        target.tipo = h.tipo;
                        target.giros = h.giros;
                        Object.keys(h).forEach(k => {
                            if (k !== 'f' && k !== 'c') target[k] = h[k];
                        });
                    }
                });


                if (mapa_original.nombre) document.getElementById('input-nombre-mapa').value = mapa_original.nombre;
                if (mapa_original.numeros) {
                    Object.keys(mapa_original.numeros).forEach(k => {
                        configNumerosOrdenes[k] = mapa_original.numeros[k].valores || [];
                    });
                }
            }
            mapa_original = {
                nombre: document.getElementById('input-nombre-mapa').value,
                hexagono: nuevaRejilla,
                recursos: (mapa_original && mapa_original.recursos) ? mapa_original.recursos : {},
                numeros: (mapa_original && mapa_original.numeros) ? mapa_original.numeros : {}
            };

            mapa_visual = mapa_original; // Visual points to the editable grid
            renderizarMapa(mapa_visual, tablero);
            actualizarEventosPintado(); // Updates clicks on mapa_visual
            actualizarUIOrdenes();
            actualizarUIRecursosAleatorios();

            // 6. Render Palette using generic loader
            document.getElementById('menu-piezas-creador').style.display = 'block';
            await cargarMapa("Piezas.json", document.getElementById('contenedor-mapa-piezas'), esJuego = false);
        }

        function cargarMapaDesdeArchivo(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const json = JSON.parse(e.target.result);
                    mapa_original = json;
                    // Reiniciar editor con este mapa
                    activarModoCreador();
                    alert("Mapa cargado correctamente en el editor.");
                } catch (err) {
                    console.error("Error al leer el archivo:", err);
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
            // Reset input para permitir recargar el mismo archivo
            input.value = '';
        }

        function jugarMapaActual() {
            // CONVERTIR EDITABLE A JUGABLE
            // 1. Filtrar vacíos
            const hexsReales = mapa_visual.hexagono.filter(h => h.tipo !== 'vacio');

            // 2. Construir objeto mapa
            // Construir objeto de números final
            const numerosFinales = {};
            Object.keys(configNumerosOrdenes).forEach(k => {
                numerosFinales[k] = {
                    tipo: "fijo",
                    valores: configNumerosOrdenes[k]
                };
            });

            // GESTION DE RECURSOS FINAL
            // Usamos configRecursosAleatorios como fuente de verdad
            const recursosFinales = {};

            // Recorrer hexs para ver qué se necesita
            hexsReales.forEach(h => {
                const tipo = Array.isArray(h.tipo) ? h.tipo[0] : h.tipo;
                if (tipo.startsWith('aleatorio_')) {
                    if (configRecursosAleatorios[tipo]) {
                        recursosFinales[tipo] = configRecursosAleatorios[tipo];
                    } else if (mapa_original && mapa_original.recursos && mapa_original.recursos[tipo]) {
                        recursosFinales[tipo] = JSON.parse(JSON.stringify(mapa_original.recursos[tipo]));
                    } else {
                        // Default dummy
                        recursosFinales[tipo] = { tipos: ["bosque"], cantidades: [1] };
                    }
                }
            });


            const nuevoMapa = {
                nombre: document.getElementById('input-nombre-mapa').value,
                hexagono: hexsReales,
                recursos: recursosFinales,
                numeros: numerosFinales
            };

            // Preservar lógica de recursos aleatorios y números si existen en los hexs
            // (La lógica de `descargarJSONCreado` ya hace esto bien, podríamos reutilizarla o extraerla)
            // Por simplicidad, usaremos la estructura actual de los hexs que ya tienen 'orden_x', etc.

            // 3. Modificamos mapa_original global
            mapa_original = nuevoMapa;

            // 4. Salir de modo creador
            document.body.classList.remove('modo-edicion');
            document.getElementById('menu-creador').classList.remove('abierto');
            document.getElementById('menu-piezas-creador').style.display = 'none';
            document.getElementById('tablero').classList.remove('pintando');

            // 5. Procesar y Jugar
            mapa_visual = procesarConfiguracion(structuredClone(mapa_original));
            renderizarMapa(mapa_visual, tablero);
            inicializarDadosSegunMapa(mapa_visual);

            // Re-render con nuevo zoom
            renderizarMapa(mapa_visual, tablero);
        }

        function seleccionarNivelOrden(nivel) {
            // Si pulsamos el que ya está activo, lo desactivamos
            if (nivelOrdenActivo === nivel) {
                nivelOrdenActivo = 0;
            } else {
                nivelOrdenActivo = nivel;
                piezaSeleccionada = null; // Desactivar otros pinceles
            }
            
            actualizarUIOrdenes();
            document.getElementById('tablero').classList.toggle('pintando', nivelOrdenActivo !== 0);
            
            // IMPORTANTE: Dibujamos las fichas actuales en el mapa para ver el progreso
            dibujarFichasDeOrden();
        }

        function dibujarFichasDeOrden() {
            const hexsEnPantalla = document.querySelectorAll('#tablero .hex');
            
            hexsEnPantalla.forEach((div, index) => {
                const h = mapa_visual.hexagono[index];
                // Limpiamos fichas previas de edición para no duplicar
                const fichaPrevia = div.querySelector('.numero-ficha');
                if (fichaPrevia) fichaPrevia.remove();

                // Si no estamos en modo orden, no dibujamos nada extra (limpieza)
                if (nivelOrdenActivo === 0) return;

                // Buscamos si este hexágono tiene algún orden asignado (1, 2 o 3)
                for (let i = 1; i <= 3; i++) {
                    const valOrden = h[`orden_${i}`];
                    if (valOrden) {
                        const ficha = document.createElement('div');
                        ficha.className = `numero-ficha ficha-orden-${i}`;
                        ficha.innerText = valOrden;
                        ficha.style.pointerEvents = 'none';
                        div.appendChild(ficha);
                    }
                }
            });
        }

        function actualizarEventosPintado() {
            const hexsEnPantalla = document.querySelectorAll('#tablero .hex');
            hexsEnPantalla.forEach((div, index) => {
                div.onclick = (e) => {
                    
                    if (nivelOrdenActivo > 0) {
                        const prop = `orden_${nivelOrdenActivo}`;
                        
                        // Si el hexágono ya tiene ESTE mismo orden, lo quitamos (borrar)
                        if (mapa_visual.hexagono[index][prop]) {
                            delete mapa_visual.hexagono[index][prop];
                        } else {
                            // Si no, calculamos el siguiente número correlativo para este orden
                            const maxActual = mapa_visual.hexagono.reduce((max, h) => Math.max(max, h[prop] || 0), 0);
                            mapa_visual.hexagono[index][prop] = maxActual + 1;
                        }
                        
                        // Refrescamos visualmente las fichas
                        dibujarFichasDeOrden();
                    } else if (piezaSeleccionada) {

                        let h = mapa_visual.hexagono[index];
                        // Asegurar que existan las 3 capas en el objeto
                        if (!Array.isArray(h.tipo)) {
                            h.tipo = [h.tipo || 'vacio', null, null];
                            h.giros = [Array.isArray(h.giros) ? h.giros[0] : (h.giros || 0), 0, 0];
                        }

                        // Guardar en la capaActiva (0, 1 o 2)
                        if (h.tipo[capaActiva] === piezaSeleccionada) {
                            h.tipo[capaActiva] = (capaActiva === 0) ? 'vacio' : null;
                            h.giros[capaActiva] = 0;
                        } else {
                            h.tipo[capaActiva] = piezaSeleccionada;
                            h.giros[capaActiva] = giroSeleccionado;
                        }
                        renderizarMapa(mapa_visual, tablero);
                        actualizarEventosPintado();
                    }
                };
            });
        }


        // LÓGICA DE DADOS 3D
        let rotacionBase = 0;
        function inicializarDadosSegunMapa(mapa) {
            const contenedor = document.getElementById('panel-dados-external');
            if (!mapa.config_dados) {
                contenedor.style.display = 'none';
                return;
            }
            contenedor.style.display = 'flex';
            contenedor.innerHTML = '<div id="resultado-suma">--</div>'; // Limpiar
            // Recorremos cada botón definido en el JSON
            Object.keys(mapa.config_dados).forEach((idBoton) => {
                const btnConfig = mapa.config_dados[idBoton];
                const wrapperId = `wrapper-${idBoton}`;
                let btnHtml = `
                <div class="dice-group" style="margin-bottom: 15px; text-align:center;">
                    <div class="dice-wrapper" id="${wrapperId}" style="margin-bottom:10px; display:flex; gap:15px; justify-content:center;">`;
                btnConfig.dados.forEach((dado, idxDado) => {
                    const idUnico = `dado-${idBoton}-${idxDado}`;
                    btnHtml += `
                    <div class="scene">
                        <div id="${idUnico}" class="cube">
                            ${dado.caras_contenido.map((cont, i) => `
                                <div class="cube_face face-${i + 1}" style="background-color: ${dado.caras_fondo[i]}">
                                    ${formatearContenidoCara(cont)}
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                });
                btnHtml += `
                    </div>
                    <button class="btn-lanzar" onclick="lanzarGrupo('${idBoton}')">${btnConfig.nombre}</button>
                </div>`;
                contenedor.insertAdjacentHTML('beforeend', btnHtml);
            });
        }
        function formatearContenidoCara(tipo) {
            // Si es un número (del 1 al 6), lo devolvemos tal cual
            if (!isNaN(tipo)) return tipo;
            // Si es un color, dibujamos un círculo (punto)
            const coloresMap = {
                "verde": "#27ae60",
                "azul": "#2980b9",
                "amarillo": "#f1c40f",
                "rojo": "#c0392b",
                "marron": "#784212",
                "violeta": "#8e44ad"
            };
            if (coloresMap[tipo]) {
                return `<div style="width:25px; height:25px; border-radius:50%; background:${coloresMap[tipo]}; border:2px solid rgba(0,0,0,0.2)"></div>`;
            }
            // Si es pirata u otros iconos
            if (tipo === "pirata") return "⛵";
            return tipo;
        }
        function aplicarRotacion(id, valor, rotacionBase) {
            const cubo = document.getElementById(id);
            // Definimos las rotaciones extra para cada cara (X, Y)
            const rotaciones = {
                1: { x: 0, y: 0 },   // Frontal
                2: { x: 0, y: 180 }, // Trasera
                3: { x: 0, y: -90 }, // Derecha
                4: { x: 0, y: 90 },  // Izquierda
                5: { x: -90, y: 0 },   // Superior
                6: { x: 90, y: 0 }    // Inferior
            };

            const r = rotaciones[valor];
            // Sumamos la rotación base (las vueltas completas) para que el giro sea fluido
            cubo.style.transform = `translateZ(-25px) rotateX(${r.x + rotacionBase}deg) rotateY(${r.y + rotacionBase}deg)`;
        }
        function lanzarGrupo(idBoton) {
            const btnConfig = mapa_visual.config_dados[idBoton];
            rotacionBase += 720;
            let sumaNumerica = 0;
            let esTiradaNumerica = false;

            // 1. Limpiar iluminación previa inmediatamente al lanzar
            document.querySelectorAll('.hex').forEach(h => h.classList.remove('iluminado'));

            btnConfig.dados.forEach((dado, idx) => {
                const valorCara = Math.floor(Math.random() * 6) + 1;
                const idUnico = `dado-${idBoton}-${idx}`;
                aplicarRotacion(idUnico, valorCara, rotacionBase);

                const contenido = dado.caras_contenido[valorCara - 1];
                if (!isNaN(contenido)) {
                    sumaNumerica += parseInt(contenido);
                    esTiradaNumerica = true;
                }
            });
            if (esTiradaNumerica) {
                // Esperamos a que la animación de los dados (1s) termine
                setTimeout(() => {
                    const display = document.getElementById('resultado-suma');
                    display.innerText = sumaNumerica;
                    display.style.color = (sumaNumerica === 7) ? '#ff4d4d' : '#f1c40f';

                    // 2. BUSCAR E ILUMINAR: Ahora que tenemos la suma final
                    const hexs = document.querySelectorAll('.hex');
                    hexs.forEach(div => {
                        const ficha = div.querySelector('.numero-ficha');
                        // Comparación estricta del número
                        if (ficha && parseInt(ficha.innerText) === sumaNumerica) {
                            div.classList.add('iluminado');
                        }
                    });
                }, 1000);
            }
        }

        function descargarJSONCreado() {
            try {
                // 1. Filtrar solo los hexágonos que no están vacíos
                if (!mapa_visual || !mapa_visual.hexagono) {
                    throw new Error("No hay datos de mapa para exportar.");
                }

                const hexagonosActivos = mapa_visual.hexagono.filter(h => h.tipo !== 'vacio');

                if (hexagonosActivos.length === 0) {
                    alert("El mapa está vacío. Dibuja algo antes de descargar.");
                    return;
                }

                const recursosDinamicos = {};
                const numerosDinamicos = {};

                // 2. Mapear los hexágonos y detectar dinámicamente cuántos órdenes existen
                const hexagonosParaExportar = hexagonosActivos.map(h => {
                    const hexExport = {
                        f: h.f,
                        c: h.c,
                        tipo: h.tipo,
                        giros: h.giros || [0]
                    };

                    // Gestionar Recursos Aleatorios (bolsas)
                    if (typeof h.tipo === 'string' && h.tipo.startsWith('aleatorio_')) {
                        const bolsaNombre = h.tipo;
                        if (!recursosDinamicos[bolsaNombre]) {
                            if (configRecursosAleatorios[bolsaNombre]) {
                                recursosDinamicos[bolsaNombre] = configRecursosAleatorios[bolsaNombre];
                            } else if (mapa_original && mapa_original.recursos && mapa_original.recursos[bolsaNombre]) {
                                recursosDinamicos[bolsaNombre] = mapa_original.recursos[bolsaNombre];
                            } else {
                                // Default
                                recursosDinamicos[bolsaNombre] = { tipos: ["bosque"], cantidades: [1] };
                            }
                        }
                    }

                    // Gestionar TODOS los órdenes
                    Object.keys(h).forEach(prop => {
                        if (prop.startsWith('orden_')) {
                            hexExport[prop] = h[prop];
                            if (!numerosDinamicos[prop]) {
                                numerosDinamicos[prop] = { "tipo": "fijo", "valores": [] };
                            }
                        }
                    });

                    return hexExport;
                });

                // 3. Rellenar los arrays de valores
                Object.keys(numerosDinamicos).forEach(ordenKey => {
                    const cantidadFichas = hexagonosParaExportar.filter(h => h[ordenKey]).length;
                    if (configNumerosOrdenes[ordenKey] && configNumerosOrdenes[ordenKey].length > 0) {
                        numerosDinamicos[ordenKey].valores = configNumerosOrdenes[ordenKey];
                    } else {
                        numerosDinamicos[ordenKey].valores = new Array(cantidadFichas).fill(null);
                    }
                });

                const nombreMapa = document.getElementById('input-nombre-mapa').value || "Mapa Personalizado";

                const resultado = {
                    nombre: nombreMapa,
                    hexagono: hexagonosParaExportar,
                    recursos: recursosDinamicos,
                    numeros: numerosDinamicos
                };

                // 4. Ejecutar descarga
                const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${nombreMapa.replace(/\s+/g, '_')}.json`;
                a.click();

            } catch (e) {
                console.error("Error al descargar JSON:", e);
                alert("Error al descargar el mapa: " + e.message);
            }
        }

                // 2. Sincronizamos el input visualmente

                if (input) input.value = num;

                // 3. Re-renderizamos el mapa

            </div>`;
        }
        async function cargarMapa(nombreMapa, contenedor = document.getElementById('tablero'), esJuego = true) {
            try {
                // Remove editing cursor if loading into main board
                if (esJuego) {
                    document.body.classList.remove('modo-edicion');
                    document.getElementById('tablero').classList.remove('pintando');
                    // Restauramos el tamaño de los hexágonos al valor del input de calibración
                    let pxGuardados = document.getElementById('input-calibracion-px').value;
                    document.documentElement.style.setProperty('--hex_wpx', pxGuardados + 'px');
                }

                const respuesta = await fetch(`maps/${nombreMapa}`);
                if (!respuesta.ok) {
                    throw new Error(`No se pudo encontrar el archivo: ${nombreMapa}`);
                }
                const json = await respuesta.json();

                if (esJuego) {
                    // 1. Guardamos el Original
                    mapa_original = structuredClone(json); // Copia profunda

                    // 2. Procesamos para crear el Visual
                    mapa_visual = procesarConfiguracion(structuredClone(json));

                    renderizarMapa(mapa_visual, contenedor);
                    inicializarDadosSegunMapa(mapa_visual);
                    toggleMenu();
                } else {
                    // MODO PALETA / GENERIC LOAD
                    let dataToRender = json;
                    let hexs = json.hexagono || [];

                    if (hexs.length > 0) {
                        dataToRender = {hexagono: hexs};

                        let minF = Infinity, minC = Infinity;
                        hexs.forEach(p => {
                            if (p.f < minF) minF = p.f; if (p.c < minC) minC = p.c;
                        });

                        dataToRender.hexagono = hexs.map(p => ({
                            ...p,
                            f: p.f - minF,
                            c: p.c - minC
                        }));
                    }

                    renderizarMapa(dataToRender, contenedor);

                    // Si es la paleta, añadimos los eventos de click especiales
                    if (contenedor.id === 'contenedor-mapa-piezas') {
                        const hexs = contenedor.querySelectorAll('.hex');
                        hexs.forEach(div => {
                            div.onclick = () => {
                                const tipo = div.dataset.tipo;
                                const girosData = JSON.parse(div.dataset.giros || "[0]");

                                contenedor.querySelectorAll('.hex').forEach(h => {
                                    h.style.borderColor = 'transparent';
                                    h.style.zIndex = '100';
                                });

                                if (tipo && tipo !== 'vacio') {
                                    piezaSeleccionada = tipo;
                                    giroSeleccionado = girosData[0] || 0;
                                    div.style.border = '2px solid #f1c40f';
                                    div.style.zIndex = '1000';

                                    document.getElementById('tablero').classList.add('pintando');
                                    nivelOrdenActivo = 0; // Desactivar pincel de números
                                    actualizarUIOrdenes();
                                }
                            };
                        });
                    }
                }

            } catch (e) {
                console.error("Error cargando el JSON:", e);
                // alert(`Error: Asegúrate de que el archivo JSON existe: ${nombreMapa}`);
            }
        }

        function procesarConfiguracion(maps) {
            maps.hexagono.forEach(h => {
                delete h.numeroFinal;
            });
            maps.hexagono.forEach(h => {
                if (h.numero && h.numero > 0) {
                    h.numeroFinal = h.numero;
                }
            });

            // --- 1. PREPARAR BOLSAS DE RECURSOS Y LAS ASIGNAMOS---
            for (const key in maps.recursos) {
                let bolsa = [];
                const r = maps.recursos[key];
                r.tipos.forEach((tipo, i) => {
                    for (let c = 0; c < r.cantidades[i]; c++) bolsa.push(tipo);
                });

                // Mezclamos la bolsa
                bolsa = bolsa.sort(() => Math.random() - 0.5);

                // Asignamos tipos a hexágonos que usan esta bolsa
                maps.hexagono.filter(h => Array.isArray(h.tipo) && h.tipo.includes(key)).forEach((h, index) => {
                    if (bolsa[index]) {
                        // Reemplazamos "aleatorio_1" por el recurso real (ej: "bosque")
                        h.tipoReal = h.tipo.map(t => t === key ? bolsa[index] : t);
                    }
                });
            }

            // --- 2. ASIGNAR NÚMEROS POR ÓRDENES ---
            // Procesamos cada grupo de orden (orden_1, orden_2...)

            if (maps.numeros) { // Si no hay números, salimos
                for (const ordenKey in maps.numeros) {
                    const infoOrden = maps.numeros[ordenKey];
                    let listaNumeros = [...infoOrden.valores];

                    if (infoOrden.tipo === "aleatorio") {
                        listaNumeros = listaNumeros.sort(() => Math.random() - 0.5);
                    }

                    // Filtramos hexágonos que pertenecen a este orden y NO son hexagonos sin número.
                    const hexsValidos = maps.hexagono
                        .filter(h => {
                            const tipoActual = h.tipoReal || h.tipo;
                            const nombreTipo = Array.isArray(tipoActual) ? tipoActual[0] : tipoActual;
                            return h[ordenKey] > 0 && !terrenosSinNumero.includes(nombreTipo);
                        })
                        .sort((a, b) => a[ordenKey] - b[ordenKey]);

                    // Asignamos el número de la lista según la posición
                    hexsValidos.forEach((h, index) => {
                        h.numeroFinal = listaNumeros[index] || null;
                    });
                }
            }
            return maps;
        }

        function renderizarMapa(maps, contenedorDestino = document.getElementById('tablero')) {
            contenedorDestino.innerHTML = '';
            let minF = Infinity, maxF = -Infinity, minC = Infinity, maxC = -Infinity;
            maps.hexagono.forEach(h => {
                if (h.f < minF) minF = h.f; if (h.f > maxF) maxF = h.f;
                if (h.c < minC) minC = h.c; if (h.c > maxC) maxC = h.c;
            });

            let w;
            if (contenedorDestino.id === 'contenedor-mapa-piezas') {
                w = 40;
            } else if (document.body.classList.contains('modo-edicion')) {
                w = 35;
            } else {
                w = parseInt(contenedorDestino.style.getPropertyValue('--hex_wpx')) || parseInt(document.getElementById('input-calibracion-px').value) || 100;
            }

            const totalW = ((maxC - minC) * w) + w;
            const totalH = ((maxF - minF) * w * 1.1547 * 0.75) + (w * 1.1547);
            contenedorDestino.style.width = totalW + 'px';
            contenedorDestino.style.height = totalH + 'px';

            maps.hexagono.forEach(h => {
                const div = document.createElement('div');
                div.className = 'hex';
                div.dataset.tipo = Array.isArray(h.tipo) ? h.tipo[0] : h.tipo;
                div.dataset.giros = JSON.stringify(h.giros || [0]);

                div.style.top = `calc((${h.f} - ${minF}) * ${w * 1.1547 * 0.75}px)`;
                div.style.left = `calc((${h.c} - ${minC}) * ${w}px)`;

                // NOTA IMPORTANTE: Si estamos en el editor de piezas (palette), sobreescribimos tamaño
                if (contenedorDestino.id === 'contenedor-mapa-piezas') {
                    div.style.width = w + 'px';
                    div.style.height = (w * 1.1547) + 'px';
                }

                // --- GESTION DE CAPAS VISUALES ---
                // Interpretamos 'h.tipoReal' o 'h.tipo' como capas. 
                // Si es array: [fondo, detalle...]. Si es string: [fondo]
                const tipoParaRender = h.tipoReal || h.tipo;
                const capasLista = Array.isArray(tipoParaRender) ? tipoParaRender : [tipoParaRender];
                const girosLista = Array.isArray(h.giros) ? h.giros : [h.giros || 0];

                div.innerHTML = '';
                // Renderizar las 3 capas visuales
                capasLista.forEach((nombrePieza, i) => {
                    if (nombrePieza && nombrePieza !== 'vacio') {
                        const capaDiv = document.createElement('div');
                        capaDiv.className = i === 0 ? 'capa-visual-fondo' : 'capa-visual-detalle';
                        
                        let archivo = nombrePieza.includes('.') ? nombrePieza : nombrePieza + '.png';
                        capaDiv.style.backgroundImage = `url('images/${archivo}')`;
                        
                        const giro = (girosLista[i] || 0) * 60;
                        if (giro !== 0) capaDiv.style.transform = `rotate(${giro}deg)`;
                        div.appendChild(capaDiv);
                    }
                });

                // NUEVA CAPA "EXTRA" CLICABLE Y EFECTOS
                const divInteraccion = document.createElement('div');
                divInteraccion.className = 'capa-interaccion';

                // Lógica: Si alguna capa contiene "bruma" o "ladron"
                const tieneBruma = capasLista.some(t => t && String(t).includes('bruma'));
                const tieneLadron = capasLista.some(t => t && String(t).includes('ladron'));

                if (tieneBruma) divInteraccion.classList.add('bruma');
                if (tieneLadron) {
                    const icon = document.createElement('div');
                    icon.innerHTML = '💂'; // O una imagen de ladrón
                    icon.style.fontSize = (w * 0.4) + 'px';
                    divInteraccion.appendChild(icon);
                }

                div.appendChild(divInteraccion);


                // // 1. CAPA VISUAL FONDO (La primera imagen)
                // if (capasLista[0]) {
                //     let nombre = capasLista[0].includes('.') ? capasLista[0] : capasLista[0] + '.png';
                //     divFondo.style.backgroundImage = `url('images/${nombre}')`;
                //     const giro = (girosLista[0] || 0) * 60;
                //     if (giro !== 0) divFondo.style.transform = `rotate(${giro}deg)`;
                // }
                // div.appendChild(divFondo);

                // // 2. CAPA VISUAL DETALLE (Las siguientes imágenes, si las hay)
                // const divDetalle = document.createElement('div');
                // divDetalle.className = 'capa-visual-detalle';
                // if (capasLista.length > 1) {
                //     for (let i = 1; i < capasLista.length; i++) {
                //         const subCapa = document.createElement('div');
                //         subCapa.style.position = 'absolute';
                //         subCapa.style.top = '0'; subCapa.style.left = '0';
                //         subCapa.style.width = '100%'; subCapa.style.height = '100%';
                //         subCapa.style.backgroundSize = 'cover';

                //         let nombre = capasLista[i].includes('.') ? capasLista[i] : capasLista[i] + '.png';
                //         subCapa.style.backgroundImage = `url('images/${nombre}')`;

                //         const giro = (girosLista[i] || 0) * 60;
                //         if (giro !== 0) subCapa.style.transform = `rotate(${giro}deg)`;

                //         divDetalle.appendChild(subCapa);
                //     }
                // }
                // div.appendChild(divDetalle);

                // // 3. CAPA INTERACTIVA (Bruma, Ladrón, Clicks)
                // const divInteraccion = document.createElement('div');
                // divInteraccion.className = 'capa-interaccion';
                // divInteraccion.title = `F: ${h.f}, C: ${h.c}`; // Tooltip simple para debug

                // // Lógica para Bruma o Ladrón (PLACEHOLDERS por ahora, se activarán si el JSON lo dice)
                // if (h.tieneBruma) {
                //     divInteraccion.classList.add('bruma');
                // }
                // if (h.tieneLadron) {
                //     // Podríamos poner un icono de ladrón aquí
                //     const iconoLadron = document.createElement('div');
                //     iconoLadron.innerText = '💂'; // Icono temporal
                //     iconoLadron.style.fontSize = '30px';
                //     divInteraccion.appendChild(iconoLadron);
                // }

                // div.appendChild(divInteraccion);


                // Ficha numérica (siempre visualmente encima, pero en el DOM... 
                // ¿debe tapar la interacción? No, la ficha suele ser "visual". 
                // Pero si está encima de la capa interacción, bloqueará clicks.
                // Solución: pointer-events: none en la ficha, o ponerla DEBAJO de interacción si la interacción es invisible.
                // Dejémosla al final con z-index alto, y si molesta al click, le ponemos pointer-events: none)
                if (h.numeroFinal) {
                    const ficha = document.createElement('div');
                    ficha.className = 'numero-ficha' + (h.numeroFinal === 6 || h.numeroFinal === 8 ? ' rojo' : '');
                    ficha.style.zIndex = 50; // Encima de casi todo visualmente
                    ficha.style.pointerEvents = 'none'; // Para que no bloquee clicks en la capa de interacción
                    ficha.innerText = h.numeroFinal;
                    div.appendChild(ficha);
                }

                contenedorDestino.appendChild(div);
                if (document.body.classList.contains('modo-edicion') && nivelOrdenActivo > 0) {
                    dibujarFichasDeOrden();
                }
            });
        }

        function toggleFullScreen() {
            const btn = document.getElementById('toggle-fs');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerText = "❐";
                }).catch(err => {
                    console.error(`Error al intentar entrar en pantalla completa: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    btn.innerText = "⛶";
                }
            }
        }

        window.onload = () => {
            document.getElementById('input-calibracion-px').value = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hex_wpx'));
            mostrarPantallaInicio();
        };
    </script>
