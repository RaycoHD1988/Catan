<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catan Pro TV - Rayco Edition</title>
    <style>
        :root { 
            --linea-hex: #000000;
            --hex_wpx: 86.6px;
            --hex_hpx: 100px;
        }
        body { background-color: #0d0d0d; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .btn-flotante { 
            position: fixed; left: 10px; z-index: 1001; cursor: pointer; 
            background: #444; border: none; color: white; padding: 10px; 
            border-radius: 5px; width: 45px; height: 40px; display: flex; 
            align-items: center; justify-content: center; font-size: 20px;
        }
        #toggle-menu { left: 50px; width: auto; padding: 10px 15px; }
        #toggle-fs {right: 0px}

        .seccion-colapsable { border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .cabecera-seccion { 
            padding: 12px; background: rgba(255,255,255,0.07); cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .cabecera-seccion::after { content: '▼'; font-size: 0.7em; transition: transform 0.3s; }
        .seccion-colapsable.activa .cabecera-seccion::after { transform: rotate(180deg); }
        .contenido-seccion { 
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; 
            padding: 0 10px; opacity: 0;
        }
        .seccion-colapsable.activa .contenido-seccion { 
            max-height: 1500px; /* Un valor alto para que quepa todo */
            padding: 15px 10px; opacity: 1;
        }
        #menu-lateral { 
            position: fixed; 
            left: -280px; 
            top: 0; 
            width: 250px; 
            height: 100vh; 
            background: rgba(25, 25, 25, 0.98); 
            backdrop-filter: blur(10px);
            transition: 0.3s; 
            z-index: 1000; 
            padding: 15px; 
            border-right: 2px solid #444;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto; 
            box-sizing: border-box; 
        }

        #menu-lateral::-webkit-scrollbar {
            width: 8px;
        }
        #menu-lateral::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        #lista-selectores {
            max-height: 400px; 
            overflow-y: auto;
            padding-right: 5px;
        }
        #menu-lateral.abierto { left: 0; }

        .seccion { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .grid-config { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.8em; }
        .grid-config input { width: 90%; background: #111; border: 1px solid #444; color: #00ff00; padding: 3px; }

        .contenedor-tablero { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: auto; background: #0a2333; 
        }

        .hex {
            position: absolute;
            width: var(--hex_wpx); 
            height: var(--hex_hpx); 
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            background-size: cover; 
            background-position: center;
            transition: filter 0.1s;
            z-index: 1;
        }

        .hex:hover { filter: brightness(1.3); z-index: 100 !important; }

        /* --- TUS IMÁGENES DE RECURSOS --- */
        .vacio              { background-image: url('images/vacio.png'); background-color: #0a2333;}
        .agua               { background-image: url('images/agua.png'); background-color: #2980b9;}
        .peces              { background-image: url('images/peces.png'); background-color: #2980b9;}
        .rio                { background-image: url('images/rio.png'); background-color: #2980b9;}
        .puerto_comercial   { background-image: url('images/puerto_comercial.png'); background-color: #2980b9;}
        .guarida_pirata     { background-image: url('images/guarida_piratas.png'); background-color: #2980b9;}
        .bosque             { background-image: url('images/bosque.png'); background-color: #27ae60;}
        .trigo              { background-image: url('images/trigo.png'); background-color: #f1c40f;}
        .oveja              { background-image: url('images/oveja.png'); background-color: #a2d149;}
        .piedra             { background-image: url('images/piedra.png'); background-color: #7f8c8d;}
        .arcilla            { background-image: url('images/arcilla.png'); background-color: #e67e22;}
        .desierto           { background-image: url('images/desierto.png'); background-color: #d35400;}
        .oasis              { background-image: url('images/oasis.png'); background-color: #d35400;}
        .navidad            { background-image: url('images/navidad.png'); background-color: #ecf0f1}
        .castillo           { background-image: url('images/castillo.png'); background-color: #ecf0f1}
        .aserradero         { background-image: url('images/aserradero.png'); background-color: #ecf0f1}
        .pascua             { background-image: url('images/pascua.png'); background-color: #ecf0f1}
        .bruma              { background-image: url('images/bruma.png'); background-color: #7f8c8d;}
        .marmol             { background-image: url('images/marmol.png'); background-color: #7f8c8d;}
        .vidrio             { background-image: url('images/vidrio.png'); background-color: #7f8c8d;}
        .aleatorio          { background-image: none; background-color: #ecf0f1; color: black; font-weight: bold;}

        .numero { 
            background: white; border-radius: 50%; width: 32px; height: 32px; 
            display: flex; align-items: center; justify-content: center; 
            color: black; font-weight: bold; border: 2px solid #000;
            pointer-events: none; 
        }

        .rojo { color: red; }
        .btn { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; color: white; }
        .btn-blue { background: #2980b9; }
        .btn-green { background: #27ae60; }
        .selector-recurso { 
            display: flex; align-items: center; gap: 10px; padding: 6px; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; font-size: 0.85em;
        }
        .selector-recurso.activo { border-color: #ffeb3b; background: rgba(255, 255, 255, 0.1); }
        .mini { 
            width: 25px; height: 25px; 
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); 
            background-size: cover; background-position: center;
        }

        .modal {
            display: none; position: fixed; z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center; justify-content: center;
        }
        .modal-contenido {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #444;
            max-width: 450px;
            width: 90%;
            text-align: center;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .grid-opciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            max-height: 60vh; 
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: #444 #222;
        }
        .grid-opciones::-webkit-scrollbar {
            width: 8px;
        }
        .grid-opciones::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        .fila-opcion {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px;
        }
        .controles-num { display: flex; align-items: center; gap: 10px; }
        .btn-qty { background: #444; border: none; color: white; width: 25px; height: 25px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .qty-val { width: 30px; text-align: center; font-weight: bold; color: #00ff00; }
        
        #contador-info { font-weight: bold; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .falta      { background: #633; color: #ffcccc; }
        .perfecto   { background: #141; color: #ccffcc; }
        .sobra      { background: #652; color: #ffffcc; }
    </style>
</head>
<body>

<div id="modalAleatorio" class="modal">
    <div class="modal-contenido">
        <h3>✨ Configurar Recursos</h3>
        <div id="contador-info" class="falta">
            Restantes: <span id="res-restantes">0</span> / <span id="res-totales">0</span>
        </div>
        <div id="grid-opciones" class="grid-opciones"></div>
        <button id="btn-ejecutar" class="btn btn-green" onclick="ejecutarGeneracion()" disabled>¡Generar Mapa!</button>
        <button class="btn" style="background:#666; margin-top:10px;" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<button id="toggle-menu" class="btn-flotante" onclick="toggleMenu()">☰ Menú</button>
<button id="toggle-fs"   class="btn-flotante" onclick="toggleFullScreen()">⛶</button>

<div id="menu-lateral">
    <div class="seccion-colapsable activa">
        <div class="contenido-seccion">
            <small style="color: #888; display: block; margin-bottom: 5px;">Selecciona una base para generar:</small>
            <button class="btn btn-blue" onclick="cargarPlantilla('Catan Básico (3-4)')">Catan Estándar (3-4)</button>
            <hr style="opacity: 0.1; margin: 10px 0;">
            <button class="btn" style="background: #555;" onclick="alert('Próximamente: Podrás importar tus propios JSON')">📂 Importar Configuración</button>
        </div>
    </div>

    <div class="seccion-colapsable">
        <div class="cabecera-seccion" onclick="toggleSeccion(this)">🎨 Generar Mapa</div>
        <div class="contenido-seccion">
            <button class="btn btn-green" style="margin-top:5px;" onclick="generarAleatorios()">✨ Generar Aleatorios</button>
            <button class="btn btn-blue" style="margin-top:5px; margin-bottom:10px;" onclick="repartirNumeros()">🎲 Mezclar Números</button>
            <div id="lista-selectores"></div>
        </div>
    </div>

    <div class="seccion-colapsable">
        <div class="cabecera-seccion" onclick="toggleSeccion(this)">⚙️ Configuración</div>
        <div class="contenido-seccion">
            <div class="grid-config">
                <span>Ancho (cm)</span><span>Alto (cm)</span> <input type="number" id="tv-w-cm" value="121.2" oninput="aplicarDimensiones()"><input type="number" id="tv-h-cm" value="68">
                <span>Ancho (PX)</span><span>Alto (PX)</span> <input type="number" id="tv-w-px" value="1920" oninput="aplicarDimensiones()"><input type="number" id="tv-h-px" value="1080">
            </div>
            <button class="btn btn-blue" onclick="aplicarDimensiones()">Actualizar Medidas</button>
        </div>
    </div>
</div>

<div class="contenedor-tablero">
    <div id="tablero"></div>
</div>

<script>
    const HEX_REAL_CM = 7.7;
    const LISTA_NUMEROS_3_4_player = [5,2,6,3,8,10,9,12,11,4,8,10,9,4,5,6,3,11];
    const LISTA_NUMEROS_5_6_player = [2,5,4,6,3,9,8,11,11,10,6,3,8,4,8,10,11,12,10,5,4,9,5,9,12,3,2,6];

    const PLANTILLAS_MAPA = {
        "Catan Básico (3-4)": {
            // La lista de números oficial en el orden que quieres que aparezcan
            numeros: [5,2,6,3,8,10,9,12,11,4,8,10,9,4,5,6,3,11],
            recursos: {
                bosque: 4, trigo: 4, oveja: 4, piedra: 3, arcilla: 3, desierto: 1
            },
            layout: [
                // Ejemplo: El desierto es fijo y no tiene "orden", por lo que no recibirá número
                {f:0, c:5, tipo:'agua'}, {f:0, c:6, tipo:'agua'}, {f:0, c:7, tipo:'agua'}, {f:0, c:8, tipo:'agua'},
                {f:1, c:4, tipo:'agua'}, {f:1, c:5, tipo:'aleatorio', orden:  1}, {f:1, c:6, tipo:'aleatorio', orden:  2}, {f:1, c:7, tipo:'aleatorio', orden:  3},{f:1, c:8, tipo:'agua'},
                {f:2, c:4, tipo:'agua'}, {f:2, c:5, tipo:'aleatorio', orden: 12}, {f:2, c:6, tipo:'aleatorio', orden: 13}, {f:2, c:7, tipo:'aleatorio', orden: 14}, {f:2, c:8, tipo:'aleatorio', orden:  4},{f:2, c:9, tipo:'agua'},
                {f:3, c:3, tipo:'agua'}, {f:3, c:4, tipo:'aleatorio', orden: 11}, {f:3, c:5, tipo:'aleatorio', orden: 18}, {f:3, c:6, tipo:'aleatorio', orden: 19}, {f:3, c:7, tipo:'aleatorio', orden: 15}, {f:3, c:8, tipo:'aleatorio', orden: 5},{f:3, c:9, tipo:'agua'},
                {f:4, c:4, tipo:'agua'}, {f:4, c:5, tipo:'aleatorio', orden: 10}, {f:4, c:6, tipo:'aleatorio', orden: 17}, {f:4, c:7, tipo:'aleatorio', orden: 16}, {f:4, c:8, tipo:'aleatorio', orden:  6},{f:4, c:9, tipo:'agua'},
                {f:5, c:4, tipo:'agua'}, {f:5, c:5, tipo:'aleatorio', orden:  9}, {f:5, c:6, tipo:'aleatorio', orden:  8}, {f:5, c:7, tipo:'aleatorio', orden:  7}, {f:5, c:8, tipo:'agua'},
                {f:6, c:5, tipo:'agua'}, {f:6, c:6, tipo:'agua'}, {f:6, c:7, tipo:'agua'}, {f:6, c:8, tipo:'agua'}
            ]
        }
    };


    const LISTA_NUMEROS = LISTA_NUMEROS_3_4_player;
    
    // Todos tus tipos de recursos originales
    const RECURSOS_INFO = [
        {id:'aleatorio',        nombre:'🎲 Aleatorio'},
        {id:'bosque',           nombre:'Bosque'},
        {id:'trigo',            nombre:'Trigo'},
        {id:'oveja',            nombre:'Oveja'},
        {id:'piedra',           nombre:'Piedra'},
        {id:'arcilla',          nombre:'Arcilla'},
        {id:'agua',             nombre:'Agua'},
        {id:'desierto',         nombre:'Desierto'},
        {id:'peces',            nombre:'Peces'},
        {id:'puerto_comercial', nombre:'Puerto'},
        {id:'rio',              nombre:'Río'},
        {id:'oasis',            nombre:'Oasis'},
        {id:'bruma',            nombre:'Bruma'},
        {id:'marmol',           nombre:'Mármol'},
        {id:'vidrio',           nombre:'Vidrio'},
        {id:'aserradero',       nombre:'Aserradero'},
        {id:'guarida_pirata',   nombre:'Piratas'},
        {id:'navidad',          nombre:'Navidad'},
        {id:'pascua',           nombre:'Pascua'},
        {id:'castillo',         nombre:'Castillo'}
    ];

    let tipoSeleccionado = 'vacio';
    let cantidades = {};
    let totalNecesario = 0;

    // Dibujar selectores en el menú lateral
    function cargarMenuRecursos() {
        const contenedor = document.getElementById('lista-selectores');
        RECURSOS_INFO.forEach(res => {
            const div = document.createElement('div');
            div.className = 'selector-recurso';
            if(res.id === 'aleatorio') div.classList.add('activo');
            div.onclick = () => seleccionarTipo(res.id, div);
            div.innerHTML = `<div class="mini ${res.id}"></div> ${res.nombre}`;
            contenedor.appendChild(div);
        });
        tipoSeleccionado = 'aleatorio';
    }

    function seleccionarTipo(tipo, elemento) {
        tipoSeleccionado = tipo;
        document.querySelectorAll('.selector-recurso').forEach(el => el.classList.remove('activo'));
        elemento.classList.add('activo');
    }

    function aplicarDimensiones() {
        const wCm = parseFloat(document.getElementById('tv-w-cm').value);
        const hCm = parseFloat(document.getElementById('tv-h-cm').value);
        const wPx = parseFloat(document.getElementById('tv-w-px').value);
        
        const hexW = HEX_REAL_CM * wPx / wCm;
        const hexH = hexH * 0.866;
        
        document.documentElement.style.setProperty('--hex_wpx', hexW + 'px');
        document.documentElement.style.setProperty('--hex_hpx', hexH + 'px');        

        window.columnasCalculadas = wCm /  HEX_REAL_CM;
        window.filasCalculadas    = hCm / (HEX_REAL_CM * 0.866);

        crearTablero();
    }

    function crearTablero() {
        const tablero = document.getElementById('tablero');
        tablero.innerHTML = '';
        
        const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hex_wpx'));
        const h = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hex_hpx'));
        
        const filas = window.filasCalculadas || 10; 
        const cols  = window.columnasCalculadas || 14;

        // Calculamos el desfase inicial para centrar TODO el bloque de hexágonos
        const totalW = cols * w;
        const totalH = filas * (h * 0.75);
        const offsetX = (window.innerWidth - totalW) / 2;
        const offsetY = (window.innerHeight - totalH) / 2;

        for (let f = 0; f < filas; f++) {
            for (let c = 0; c < cols; c++) {
                const hex = document.createElement('div');
                hex.className = 'hex vacio';
                
                // Posicionamiento con desfase de filas impares y centrado
                const posX = c * w + (f % 2 === 1 ? w / 2 : 0) + offsetX;
                const posY = f * (h * 0.75) + offsetY;
                
                hex.style.left = posX + 'px';
                hex.style.top = posY + 'px';

                // Guardamos coordenadas en el elemento para facilitar las plantillas
                hex.dataset.f = f;
                hex.dataset.c = c;

                hex.onclick = function() {
                    this.className = 'hex ' + tipoSeleccionado;
                    this.innerHTML = (tipoSeleccionado === 'aleatorio') ? '<strong>?</strong>' : '';
                };
                tablero.appendChild(hex);
            }
        }
    }

    function generarAleatorios() {
        const aleatorios = document.querySelectorAll('.hex.aleatorio');
        if (aleatorios.length === 0) return alert("Primero coloca hexágonos '🎲 Aleatorio'.");

        totalNecesario = aleatorios.length;
        document.getElementById('res-totales').innerText = totalNecesario;
        const grid = document.getElementById('grid-opciones');
        grid.innerHTML = '';
        cantidades = {};

        // Excluimos 'aleatorio' y 'vacio' de la lista de selección para el modal
        RECURSOS_INFO.filter(r => r.id !== 'aleatorio').forEach(res => {
            cantidades[res.id] = 0;
            const fila = document.createElement('div');
            fila.className = 'fila-opcion';
            fila.innerHTML = `
                <span>${res.nombre}</span>
                <div class="controles-num">
                    <button class="btn-qty" onclick="cambiarCant('${res.id}', -1)">-</button>
                    <span class="qty-val" id="qty-${res.id}">0</span>
                    <button class="btn-qty" onclick="cambiarCant('${res.id}', 1)">+</button>
                </div>`;
            grid.appendChild(fila);
        });
        actualizarContador();
        document.getElementById('modalAleatorio').style.display = 'flex';
    }

    function cambiarCant(tipo, cambio) {
        if (cantidades[tipo] + cambio >= 0) {
            cantidades[tipo] += cambio;
            document.getElementById(`qty-${tipo}`).innerText = cantidades[tipo];
            actualizarContador();
        }
    }

    function actualizarContador() {
        const totalSeleccionado = Object.values(cantidades).reduce((a, b) => a + b, 0);
        const restantes = totalNecesario - totalSeleccionado;
        const info = document.getElementById('contador-info');
        const spanRest = document.getElementById('res-restantes');
        
        if (spanRest) spanRest.innerText = restantes;
        document.getElementById('btn-ejecutar').disabled = (restantes !== 0);

        if (restantes === 0) {
            info.className = 'perfecto';
            info.innerHTML = `✓ ¡Listo! Restantes: <span id="res-restantes">0</span>`;
        } else if (restantes > 0) {
            info.className = 'falta';
            info.innerHTML = `Faltan ${restantes} hexágonos: <span id="res-restantes">${restantes}</span>`;
        } else {
            info.className = 'sobra';
            info.innerHTML = `Sobran ${Math.abs(restantes)} hexágonos: <span id="res-restantes">${restantes}</span>`;
        }
    }

    function ejecutarGeneracion() {
        let saco = [];
        for (const [tipo, cant] of Object.entries(cantidades)) {
            for (let i = 0; i < cant; i++) saco.push(tipo);
        }
        saco.sort(() => Math.random() - 0.5);

        document.querySelectorAll('.hex.aleatorio').forEach((hex, i) => {
            hex.className = 'hex ' + saco[i];
            hex.innerHTML = '';
        });
        repartirNumeros();
        cerrarModal();
    }

    function repartirNumeros() {
        // 1. Obtener la plantilla para saber qué números usar
        const plantillaActual = Object.values(PLANTILLAS_MAPA).find(p => p.numeros); 
        if (!plantillaActual) return;

        let nums = [...plantillaActual.numeros];
        let nIdx = 0;

        // Terrenos que NO pueden tener número
        const terrenosSinNumero = ['vacio', 'agua', 'desierto', 'bruma', 'puerto_comercial', 'oasis', 'vacio'];

        // 2. Obtener y ordenar los hexágonos que tienen un 'orden' asignado
        const hexágonosConOrden = Array.from(document.querySelectorAll('.hex'))
            .filter(h => h.dataset.orden !== undefined)
            .sort((a, b) => parseInt(a.dataset.orden) - parseInt(b.dataset.orden));

        // 3. Limpiar todos los números previos de CUALQUIER hexágono
        document.querySelectorAll('.hex').forEach(h => {
            const numDiv = h.querySelector('.numero');
            if (numDiv) numDiv.remove();
            // Si aún es tipo aleatorio (con el ?), no lo tocamos hasta que se genere
        });

        // 4. Repartir siguiendo el orden estricto, pero saltando terrenos prohibidos
        hexágonosConOrden.forEach(hex => {
            const tipoActual = Array.from(hex.classList)[1];
            
            // Si el terreno actual NO está en la lista negra y quedan números
            if (!terrenosSinNumero.includes(tipoActual) && nIdx < nums.length) {
                const n = nums[nIdx++];
                hex.innerHTML = `<div class="numero ${n===6||n===8?'rojo':''}">${n}</div>`;
            } else {
                // Si es desierto/agua, nos aseguramos de que esté vacío (sin número)
                const numDiv = hex.querySelector('.numero');
                if (numDiv) numDiv.remove();
            }
        });
    }

    function cerrarModal() { document.getElementById('modalAleatorio').style.display = 'none'; }
    function toggleMenu() { document.getElementById('menu-lateral').classList.toggle('abierto'); }
    function toggleSeccion(elemento) {
        // Busca el contenedor padre (seccion-colapsable) y le pone/quita la clase 'activa'
        const padre = elemento.parentElement;
        padre.classList.toggle('activa');
    }
    function toggleFullScreen() {
        const btn = document.getElementById('toggle-fs');
        if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerText = "❐"; // Icono de "ventanas superpuestas" al entrar
                }).catch(err => {
                    console.error(`Error al intentar entrar en pantalla completa: ${err.message}`);
                });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                btn.innerText = "⛶"; // Icono de "expandir"
            }
        }
    }

    window.onload = () => {
        cargarMenuRecursos();
        aplicarDimensiones();
    };


    function cargarPlantilla(nombre) {
        const p = PLANTILLAS_MAPA[nombre];
        if(!p) return;

        crearTablero(); 
        let conteoAleatorios = 0;

        p.layout.forEach(item => {
            const hex = document.querySelector(`.hex[data-f="${item.f}"][data-c="${item.c}"]`);
            if(hex) {
                hex.className = 'hex ' + item.tipo;
                // Guardamos el orden en el dataset del hexágono
                if(item.orden) hex.dataset.orden = item.orden;
                
                if(item.tipo === 'aleatorio') {
                    hex.innerHTML = '<strong>?</strong>';
                    conteoAleatorios++;
                }
            }
        });

        cantidades = {...p.recursos};
        totalNecesario = conteoAleatorios;
        
        if(totalNecesario > 0) {
            ejecutarGeneracion();
        } else {
            repartirNumeros();
        }
    }
</script>
</body>
</html>
